<template>
    <c-se-list-page loading={isLoading}>
        <header slot="header" class="lic-header">
            <div class="se-desk-only lic-header-desk">
                <p class="eyebrow">Licencias / Mis Licencias</p>

                <template lwc:if={renderFilters}>
                    <div class="lic-title-row">
                        <h1 class="title">Mis Licencias</h1>
                        <div class="lic-actions">
                            <button
                                type="button"
                                class="filt-toggle"
                                aria-expanded={filtersPanelOpen}
                                onclick={handleToggleFiltersPanel}
                            >
                                <svg class="filt-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                    <path d="M3 6h18M6 12h12M10 18h4"></path>
                                </svg>
                                Filtros
                                <template if:true={showFilterBadge}>
                                    <span class="filt-badge">{activeFilterCount}</span>
                                </template>
                                <svg class={filterToggleChevronClass} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
                                    <path d="M6 9l6 6 6-6"></path>
                                </svg>
                            </button>
                            <button type="button" class="btn-solicitar" onclick={handleSolicitarLicencia}>
                                Solicitar Licencia
                            </button>
                        </div>
                    </div>

                    <div class="lic-meta-row">
                        <div class="lic-meta">
                            <p class="lic-meta-line">
                                <strong>{totalRegistros} elementos</strong>
                                <span> (máximo {metaMaxElementos} elementos) · Ordenado por </span>
                                <strong>Fecha de creación</strong>
                            </p>
                            <p class="lic-meta-line">
                                <span>Filtrado por </span>
                                <strong>{filtroResumen}</strong>
                            </p>
                        </div>
                        <label class="lic-search">
                            <span class="sr-only">Buscar</span>
                            <input
                                type="search"
                                placeholder="Buscar..."
                                value={searchTerm}
                                oninput={handleSearchChange}
                            />
                            <span class="search-icon">
                                <img src={iconSearchUrl} alt="" class="icon-svg" />
                            </span>
                        </label>
                    </div>
                </template>

                <template lwc:else>
                    <h1 class="title">Mis Licencias</h1>
                </template>
            </div>

            <div class="se-mob-only lic-header-mob">
                <p class="eyebrow">Módulos</p>
                <h1 class="title">Licencias</h1>

                <template lwc:if={renderFilters}>
                    <div class="lic-mob-tools">
                        <button
                            type="button"
                            class="filt-toggle"
                            aria-expanded={filtersPanelOpen}
                            onclick={handleToggleFiltersPanel}
                        >
                            Filtros
                            <template if:true={showFilterBadge}>
                                <span class="filt-badge">{activeFilterCount}</span>
                            </template>
                        </button>
                        <button type="button" class="btn-solicitar btn-solicitar-mob" onclick={handleSolicitarLicencia}>
                            + Solicitar Licencia
                        </button>
                    </div>
                    <p class="lic-meta-mobile">
                        <strong>{totalRegistros} elementos</strong>
                        <span> · </span>
                        <strong>{filtroResumen}</strong>
                    </p>
                </template>
            </div>
        </header>

        <template if:true={filtersPanelOpen}>
            <section slot="filters" class="filt-panel">
                <div class="filt-panel-head">
                    <span class="filt-panel-title">Filtros</span>
                    <span class="filt-panel-hint">Aplican junto al cultivo activo en las tabs.</span>
                    <button type="button" class="filt-link" onclick={handleClearFilters}>Limpiar</button>
                    <button type="button" class="filt-close" onclick={handleCloseFiltersPanel}>Cerrar</button>
                </div>
                <div class="filt-grid">
                    <div class="filt-group">
                        <p class="filt-label">Estado</p>
                        <div class="filt-options">
                            <template for:each={estadoFilterItems} for:item="item">
                                <button key={item.value} type="button" class="filt-option" data-group="estado" data-value={item.value} onclick={handleFilterToggle}>
                                    <span class={item.boxClass} aria-hidden="true"></span>
                                    <span>{item.label}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <div class="filt-group">
                        <p class="filt-label">Tipo</p>
                        <div class="filt-options">
                            <template for:each={tipoFilterItems} for:item="item">
                                <button key={item.value} type="button" class="filt-option" data-group="tipo" data-value={item.value} onclick={handleFilterToggle}>
                                    <span class={item.boxClass} aria-hidden="true"></span>
                                    <span>{item.label}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <div class="filt-group">
                        <p class="filt-label">Tecnología</p>
                        <div class="filt-options">
                            <template for:each={origenFilterItems} for:item="item">
                                <button key={item.value} type="button" class="filt-option" data-group="origen" data-value={item.value} onclick={handleFilterToggle}>
                                    <span class={item.boxClass} aria-hidden="true"></span>
                                    <span>{item.label}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </section>
        </template>

        <template if:true={renderList}>
            <template if:true={showCultivoResumen}>
            <c-se-cultivo-resumen
                cultivos={cultivoOptions}
                selected={selectedCultivoId}
                rows={cultivoSummaryRows}
                total-value={cultivoSummaryTotal}
                loading={cultivoSummaryLoading}
                hide-summary-on-mobile
                onselect={handleCultivoResumenSelect}
            >
                <div class="lic-list-panel">
                    <c-se-data-list
                        records={decoratedLicencias}
                        columns={columns}
                        mobile-fields={mobileFields}
                        title-field="name"
                        badge-field="statusLabel"
                        badge-tone-field="statusTone"
                        key-field="id"
                        action-label="Ver"
                        mobile-action-label="Ver detalle →"
                        mobile-action-variant="link"
                        empty-text="No hay licencias para mostrar."
                        page-size={listPageSize}
                        loading={isLoading}
                        onrowaction={handleRowAction}
                    ></c-se-data-list>

                    <c-se-pager
                        page={currentPage}
                        disable-prev={disablePrev}
                        disable-next={disableNext}
                        onprevious={handlePrev}
                        onnext={handleNext}
                    ></c-se-pager>

                    <div class="boton-reporte">
                        <button type="button" class="btn-generar" onclick={openModal}>Generar Reporte</button>
                    </div>
                </div>
            </c-se-cultivo-resumen>
        </template>

        <template if:false={showCultivoResumen}>
            <div class="lic-list-panel">
                <c-se-data-list
                    records={decoratedLicencias}
                    columns={columns}
                    mobile-fields={mobileFields}
                    title-field="name"
                    badge-field="statusLabel"
                    badge-tone-field="statusTone"
                    key-field="id"
                    action-label="Ver"
                    mobile-action-label="Ver detalle →"
                    mobile-action-variant="link"
                    empty-text="No hay licencias para mostrar."
                    page-size={listPageSize}
                    loading={isLoading}
                    onrowaction={handleRowAction}
                ></c-se-data-list>

                <c-se-pager
                    page={currentPage}
                    disable-prev={disablePrev}
                    disable-next={disableNext}
                    onprevious={handlePrev}
                    onnext={handleNext}
                ></c-se-pager>

                <div class="boton-reporte">
                    <button type="button" class="btn-generar" onclick={openModal}>Generar Reporte</button>
                </div>
            </div>
        </template>
        </template>
    </c-se-list-page>

    <template if:true={showModal}>
        <div class="modal-backdrop">
            <div class="modal">
                <button class="modal-close" onclick={closeModal}>✕</button>
                <h2>Generar Reporte</h2>
                <p>
                    Se va a generar un reporte con todos los datos<br>
                    de la tabla de licencias.<br>
                    ¿Está seguro?
                </p>
                <button type="button" class="modal-start" onclick={handleCall}>Comenzar ➝</button>
            </div>
        </div>
    </template>

    <template if:true={showReportModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="report-modal-heading" aria-modal="true"
                class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="report-modal-heading" class="slds-modal__title slds-hyphenate">
                        Reporte de Licencias
                    </h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={handleCloseReportModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isReportLoading}>
                        <div class="slds-align_absolute-center slds-p-vertical_large">
                            <c-se-brand-loader></c-se-brand-loader>
                            <p class="slds-text-align_center slds-m-top_small">
                                Generando reporte de licencias...
                            </p>
                        </div>
                    </template>
                    <template if:false={isReportLoading}>
                        <template if:true={reportResponse.success}>
                            <lightning-card title="Reporte generado exitosamente" icon-name="utility:success">
                            </lightning-card>
                        </template>

                        <template if:false={reportResponse.success}>
                            <lightning-card title="Error en la Operación" icon-name="utility:error"
                                style="max-width: 100%;overflow-x: auto;box-sizing: border-box;">
                                <div class="slds-p-horizontal_small">
                                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small">
                                        <span class="slds-assistive-text">Error</span>
                                        <h2>{reportResponse.message}</h2>

                                        <template if:true={reportResponse.statusCode}>
                                            <p class="slds-text-body_small slds-m-top_xx-small">
                                                Código de Error: {reportResponse.statusCode}
                                            </p>
                                        </template>
                                    </div>

                                    <template if:true={reportResponse.data}>
                                        <lightning-card title="Detalles del Error" icon-name="utility:warning">
                                            <div class="slds-p-horizontal_small">
                                                <div class="slds-box slds-box_xx-small slds-theme_default">
                                                    <pre style="white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; font-size: 12px;">{formattedReportData}</pre>
                                                </div>
                                            </div>
                                        </lightning-card>
                                    </template>
                                </div>
                            </lightning-card>
                        </template>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <template if:true={showRetryButton}>
                        <lightning-button
                            label="Reintentar"
                            onclick={handleRetryReport}
                            variant="brand"
                            disabled={isReportLoading}
                            class="slds-m-right_small">
                        </lightning-button>
                    </template>

                    <lightning-button
                        label="Cerrar"
                        onclick={handleCloseReportModal}
                        variant="neutral">
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
