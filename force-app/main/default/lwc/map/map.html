<template>
    <template if:true={isOpen}>
        <div class="sg-layer">
            <div class="sg-scrim" onclick={hide}></div>
            <div class="sg-modal" role="dialog" aria-modal="true" aria-label={title}>
                <div class="sg-head">
                    <h2 class="sg-title">{title}</h2>
                    <button type="button" class="sg-x" aria-label="Cerrar" title="Cerrar" onclick={hide}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div class="sg-map">
                    <iframe src={mapSource} title={title}></iframe>
                </div>
            </div>
        </div>
    </template>
</template>
