<template>
    <template if:true={shouldShow}>
        <div class="v-row">
            <div class="v-brand"><span class="brand">{brandLabel}</span></div>
            <div class="v-name">{info.variedad.Name}</div>
            <div class="v-ha">
                <label class="v-label" for="cantidad">Hectáreas</label>
                <input
                    id="cantidad"
                    class={inputClass}
                    type="number"
                    inputmode="numeric"
                    min="0"
                    step="1"
                    max={maxValue}
                    placeholder="Indicá cantidad de hectáreas"
                    value={inputValue}
                    oninput={handleInput}
                    onfocus={handleFocus}
                    onblur={handleBlur}
                />
                <template if:true={visibleError}>
                    <p class="p-err" role="alert">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
                        <span>{visibleError}</span>
                    </p>
                </template>
            </div>
            <div class="v-ht">
                <span class="v-ht-k">HT acreditada</span>
                <span class={numClass} title="Saldo de HTs disponibles">{disponiblesLabel}</span>
            </div>
        </div>
    </template>
</template>
