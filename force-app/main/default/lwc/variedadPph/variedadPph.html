<template>
    <div if:true={shouldShow}>
        <div if:true={isWizardVariant} class="se-var-row">
                <div class="se-var-brand" aria-hidden="true">
                    <svg class="se-var-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
                        <use xlink:href={icono}></use>
                    </svg>
                </div>
                <div class="se-var-copy">
                    <span class="se-var-name">{info.variedad.Name}</span>
                    <span class="se-var-disp">HT disponibles: {safeDisponibles}</span>
                </div>
                <lightning-input
                    class="se-var-input"
                    variant="label-hidden"
                    required
                    type="number"
                    placeholder="Ha"
                    step="1"
                    min="0"
                    max={maxValue}
                    onchange={updateCantidad}
                    onblur={blur}
                    onfocus={focus}
                    value={cantidad}
                    message-when-range-overflow="HT disponibles insuficientes"
                    message-when-value-missing="Requerido"
                ></lightning-input>
        </div>

        <lightning-layout if:false={isWizardVariant} vertical-align="center" horizontal-align="space" class="slds-text-align_center">
                <lightning-layout-item size="2">
                    <svg width="200" height="100">;
                        <use xlink:href={icono}></use>
                    </svg>
                </lightning-layout-item>
                <lightning-layout-item size="2">
                    {info.variedad.Name}
                </lightning-layout-item>
                <lightning-layout-item size="2">
                    <lightning-input variant="label-hidden" required type="number" placeholder="Indica Cantidad de Hectáreas" step="1" min="0" max={maxValue} onchange={updateCantidad} onblur={blur} onfocus={focus} value={cantidad} message-when-range-overflow="HT disponibles insuficientes. Ingresá un valor menor o igual a las HT disponibles o comprá más hectáreas" message-when-value-missing="Este campo es obligatorio"></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="1">
                    <lightning-formatted-number class="slds-m-horizontal_large disponibles" value={safeDisponibles}></lightning-formatted-number>
                </lightning-layout-item>
        </lightning-layout>
    </div>
</template>
