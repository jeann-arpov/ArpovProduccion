<template>
    <template if:false={loaded}>
        <div class="se-pph-loading" role="status" aria-busy="true" aria-label="Cargando">
            <c-se-brand-loader></c-se-brand-loader>
        </div>
    </template>

    <template if:true={loaded}>
        <template if:true={hasHTs}>
            <div class="se-pph">
                <c-se-page-header
                    eyebrow="PRECERTIFICACIÓN"
                    eyebrow-mobile="MÓDULOS · PPH"
                    title="Adhesión al Programa de Precertificación de Hectáreas"
                    subtitle="Es un programa de beneficios para quienes participan de Sembrá Evolución. La adhesión es gratuita, voluntaria y 100% digital"
                ></c-se-page-header>

                <div class="se-pph-layout">
                    <section class="se-panel">
                        <h2 class="se-panel-title">Requisitos para adherir</h2>
                        <ul class="se-pph-checks">
                            <template for:each={requisitos} for:item="item">
                                <li key={item.id} class="se-pph-check">
                                    <span class="se-pph-check-dot" aria-hidden="true">
                                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"></path></svg>
                                    </span>
                                    <span>{item.label}</span>
                                </li>
                            </template>
                        </ul>
                    </section>

                    <section class="se-pph-resumen">
                        <p class="se-pph-resumen-eyebrow">Beneficios</p>
                        <p class="se-pph-resumen-lead">
                            Gracias a tu adhesión a PPH vas a poder entregar el grano obtenido <strong>sin segregar tecnologías</strong>, de acuerdo a:
                        </p>
                        <p class="se-pph-resumen-lead">
                            El rendimiento promedio de tu zona, según los datos informados por la
                            Bolsa de Cereales de Buenos Aires.
                        </p>
                        <p class="se-pph-resumen-note">
                            El sistema podrá realizar validaciones técnicas para verificar la
                            correspondencia entre lo declarado y lo efectivamente entregado.
                        </p>
                    </section>
                </div>

                <footer class="se-pph-footer">
                    <button type="button" class="se-btn se-btn-primary" onclick={redirectAdhesion}>
                        Continuar →
                    </button>
                    <nav class="se-pph-tyc" aria-label="Términos y condiciones por cultivo">
                        <template for:each={tycLinks} for:item="link">
                            <a key={link.id} class="se-pph-tyc-link" href={link.url} target="_blank" rel="noopener noreferrer">{link.label}</a>
                        </template>
                    </nav>
                </footer>
            </div>
        </template>

        <template if:false={hasHTs}>
            <div class="se-pph se-pph-empty">
                <c-se-page-header
                    eyebrow="PRECERTIFICACIÓN"
                    eyebrow-mobile="MÓDULOS · PPH"
                    title="Todavía no tenés HT para precertificar"
                    subtitle="Comprá hectáreas tecnológicas y volvé para adherirte al programa."
                ></c-se-page-header>
                <button type="button" class="se-btn se-btn-primary" onclick={redirectComprar}>
                    Ir a comprar HT
                </button>
            </div>
        </template>
    </template>
</template>
