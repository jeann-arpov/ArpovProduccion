<template>
    <template if:false={loaded}>
        <div class="exampleHolder">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:true={loaded}>
        <template if:true={hasHTs}>
            <section class="pph-landing">
                <header class="pph-landing-head">
                    <p class="pph-eyebrow">Precertificación</p>
                    <h1 class="pph-title">Adherí PPH</h1>
                    <p class="pph-lead">Precertificá tu semilla propia y sembrá tranquilo la campaña 26/27.</p>
                    <p class="pph-body">
                        La adhesión al Programa de Precertificación te habilita a usar semilla propia en tu establecimiento sin conflictos de propiedad intelectual. El proceso lleva unos minutos y no tiene costo dentro del período de adhesión.
                    </p>
                </header>

                <div class="pph-accordions">
                    <details class="pph-accordion" open>
                        <summary class="pph-accordion-summary">
                            Beneficios de adherir
                            <span class="pph-chevron" aria-hidden="true">⌄</span>
                        </summary>
                        <ul class="pph-benefits">
                            <li>Semilla propia habilitada en tus establecimientos declarados.</li>
                            <li>Posibilidad de entregar toda la producción sin segregar tecnologías en la cosecha.</li>
                            <li>Adhesión gratuita y voluntaria al aceptar los Términos y Condiciones.</li>
                            <li>Certificado digital emitido al completar el trámite.</li>
                        </ul>
                    </details>

                    <details class="pph-accordion">
                        <summary class="pph-accordion-summary">
                            ¿Cómo funciona?
                            <span class="pph-chevron" aria-hidden="true">⌄</span>
                        </summary>
                        <div class="pph-accordion-body">
                            <p>Declarás la capacidad productiva total por CUIT, cargás tus establecimientos y aceptás los Términos y Condiciones del programa. Luego podés seguir el estado de cada campaña desde <strong>Tus adhesiones</strong>.</p>
                        </div>
                    </details>

                    <details class="pph-accordion">
                        <summary class="pph-accordion-summary">
                            Requisitos
                            <span class="pph-chevron" aria-hidden="true">⌄</span>
                        </summary>
                        <div class="pph-accordion-body">
                            <p>Contar con HT disponibles para precertificar, establecimientos declarados y aceptar los Términos y Condiciones vigentes para la campaña.</p>
                        </div>
                    </details>
                </div>

                <div class="pph-landing-cta">
                    <button type="button" class="pph-btn-primary" onclick={redirectAdhesion}>Adherite a PPH →</button>
                </div>
            </section>
        </template>

        <template if:false={hasHTs}>
            <section class="pph-empty">
                <h2 class="pph-empty-title">Todavía no tenés HT para precertificar</h2>
                <p class="pph-empty-copy">Comprá hectáreas tecnológicas y volvé para adherirte al programa.</p>
                <button type="button" class="pph-btn-primary" onclick={redirectComprar}>Ir a comprar HT</button>
            </section>
        </template>
    </template>
</template>
