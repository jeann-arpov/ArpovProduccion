<template>
    <c-se-list-page loading={loading}>
        <c-se-page-header
            slot="header"
            eyebrow="MIS COMPRAS"
            eyebrow-mobile="MÓDULOS · MIS COMPRAS"
            title="Mis Compras HT"
            subtitle="Compras HT del productor. Filtrá por estado, cultivo o variedad."
            show-search
            search-placeholder="Buscar..."
            onsearchchange={handleSearchChange}
        ></c-se-page-header>

        <c-se-filter-pills slot="toolbar" items={statusPills} onselect={handlePill}></c-se-filter-pills>

        <div slot="filters">
            <c-se-select
                options={cultivoOptions}
                value={cultivoSeleccionado}
                placeholder="Todos los cultivos"
                onchange={handleCultivo}
            ></c-se-select>
            <c-se-select
                options={variedadOptions}
                value={variedadSeleccionada}
                placeholder="Todas las variedades"
                onchange={handleVariedad}
            ></c-se-select>
        </div>

        <c-se-data-list
            records={filtered}
            columns={columns}
            mobile-fields={mobileFields}
            title-field="name"
            badge-field="statusLabel"
            badge-tone-field="statusTone"
            key-field="id"
            action-label="Ver"
            mobile-action-label="Ver compra →"
            empty-text="No hay compras para mostrar."
            page-size={pageSize}
            loading={loading}
            onrowaction={handleRowAction}
        ></c-se-data-list>
    </c-se-list-page>
</template>
