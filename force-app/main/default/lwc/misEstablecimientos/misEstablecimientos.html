<template>
    <c-se-list-page loading={loading}>
        <div class="est">
            <template if:true={isList}>
                <p class="eyebrow">Precertificación / Mis establecimientos</p>
                <div class="p-headrow">
                    <div class="p-head-copy">
                        <h1 class="p-title">Todos los establecimientos</h1>
                        <p class="p-sub se-desk-only">{countLabel}</p>
                    </div>
                    <div class="p-tools se-desk-only">
                        <label class="p-search p-search-desk">
                            <span class="sr-only">Buscar</span>
                            <input
                                class="p-input"
                                type="search"
                                placeholder="Buscar…"
                                value={searchKey}
                                oninput={handleSearchChange}
                            />
                            <span class="ic" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                            </span>
                        </label>
                        <button type="button" class="btn ghost" onclick={handleOpenMapa}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>
                            Abrir mapa
                        </button>
                        <button type="button" class="btn" onclick={handleNewEstablecimiento}>Nuevo establecimiento</button>
                    </div>
                </div>

                <div class="se-mob-only">
                    <div class="p-2btn">
                        <button type="button" class="btn" onclick={handleNewEstablecimiento}>Nuevo establecimiento</button>
                        <button type="button" class="btn ghost" onclick={handleOpenMapa}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>
                            Abrir mapa
                        </button>
                    </div>
                    <label class="p-search">
                        <span class="sr-only">Buscar</span>
                        <input
                            class="p-input"
                            type="search"
                            placeholder="Buscar…"
                            value={searchKey}
                            oninput={handleSearchChange}
                        />
                        <span class="ic" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                        </span>
                    </label>
                    <p class="p-count">{countLabel}</p>
                </div>

                <template if:true={hasRows}>
                    <div class="p-card p-flush se-desk-only">
                        <table class="p-etable">
                            <thead>
                                <tr>
                                    <th scope="col">Nombre del establecimiento</th>
                                    <th scope="col">Coordenadas (latitud)</th>
                                    <th scope="col">Coordenadas (longitud)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={pageRows} for:item="row">
                                    <tr key={row.id}>
                                        <td>
                                            <a class="nm" href={row.href} data-id={row.id} onclick={handleOpenRow}>{row.name}</a>
                                        </td>
                                        <td>{row.latLabel}</td>
                                        <td>{row.lngLabel}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <div class="p-card p-flush se-mob-only">
                        <template for:each={pageRows} for:item="row">
                            <a key={row.id} class="p-erow" href={row.href} data-id={row.id} onclick={handleOpenRow}>
                                <span class="nm">{row.name}</span>
                                <span class="go" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
                                </span>
                                <span class="co">{row.coordsLabel}</span>
                            </a>
                        </template>
                    </div>
                </template>

                <template if:true={showEmpty}>
                    <div class="p-empty">{emptyText}</div>
                </template>

                <template if:true={showPager}>
                    <div class="p-pager">
                        <button type="button" class="btn ghost" onclick={handlePrev} disabled={prevDisabled}>Anterior</button>
                        <span class="pg">{pageLabel}</span>
                        <button type="button" class="btn ghost" onclick={handleNext} disabled={nextDisabled}>Siguiente</button>
                    </div>
                </template>
            </template>

            <template if:true={showDetail}>
                <p class="eyebrow">
                    Precertificación /&nbsp;<a class="crumb" href={listHref} onclick={backToList}>Mis establecimientos</a>
                </p>
                <div class="p-headrow p-headrow-det">
                    <div class="p-head-copy">
                        <p class="p-kicker">Establecimiento</p>
                        <h1 class="p-title">{selected.name}</h1>
                    </div>
                    <button type="button" class="btn ghost p-mod-btn" data-focus="name" onclick={openEdit}>Modificar</button>
                </div>

                <div class="p-card p-info">
                    <button type="button" class="p-info-h" onclick={toggleInfo} aria-expanded={infoExpanded}>
                        <svg class={infoChevronClass} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                        Información
                    </button>
                    <template if:true={infoOpen}>
                        <div class="p-detail">
                            <div class="p-dfield">
                                <div class="c">
                                    <div class="k">Nombre del establecimiento</div>
                                    <div class="v">{selected.name}</div>
                                </div>
                                <button type="button" class="ed" data-focus="name" onclick={openEdit} aria-label="Modificar Nombre del establecimiento">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
                                </button>
                            </div>
                            <div class="p-dfield">
                                <div class="c">
                                    <div class="k">Productor / Comercio</div>
                                    <div class="v">{selected.productor}</div>
                                </div>
                            </div>
                            <div class="p-dfield">
                                <div class="c">
                                    <div class="k">Coordenadas</div>
                                    <div class="v">{selected.coordsLabel}</div>
                                </div>
                                <button type="button" class="ed" data-focus="lat" onclick={openEdit} aria-label="Modificar Coordenadas">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
                                </button>
                            </div>
                            <div class="p-dfield">
                                <div class="c">
                                    <div class="k">Vigente</div>
                                    <span class={vigenteBoxClass} role="img" aria-label={vigenteLabel}>
                                        <template if:true={selected.vigente}>
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
                                        </template>
                                    </span>
                                </div>
                                <button type="button" class="ed" data-focus="vigente" onclick={openEdit} aria-label="Modificar Vigente">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="p-back">
                    <button type="button" class="btn ghost" onclick={backToList}>Volver</button>
                </div>
            </template>

            <template if:true={showNotFound}>
                <p class="eyebrow">
                    Precertificación /&nbsp;<a class="crumb" href={listHref} onclick={backToList}>Mis establecimientos</a>
                </p>
                <div class="p-empty">No encontramos el establecimiento.</div>
                <div class="p-pager">
                    <button type="button" class="btn ghost" onclick={backToList}>Volver al listado</button>
                </div>
            </template>
        </div>
    </c-se-list-page>

    <template if:true={editOpen}>
        <div class="p-layer" onkeydown={handleEditKeydown}>
            <div class="p-scrim" onclick={closeEdit}></div>
            <section class="p-modal" role="dialog" aria-modal="true" aria-labelledby="est-edit-title">
                <header class="p-mhead">
                    <h2 id="est-edit-title" class="p-mtitle">{editTitle}</h2>
                    <button type="button" class="p-x" onclick={closeEdit} aria-label="Cerrar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                    </button>
                </header>

                <div class="p-mbody">
                    <p class="p-reqnote"><span class="req">*</span> = Información obligatoria</p>
                    <p class="p-step">Información</p>

                    <div class="p-fields two">
                        <div>
                            <label class="p-label" for="est-edit-name">Nombre del establecimiento<span class="req">*</span></label>
                            <input
                                id="est-edit-name"
                                class={editNameClass}
                                type="text"
                                maxlength="80"
                                data-field="name"
                                value={editName}
                                oninput={handleEditInput}
                            />
                            <template if:true={editNameError}>
                                <p class="p-err">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
                                    {editNameError}
                                </p>
                            </template>
                        </div>

                        <div>
                            <span class="p-label">Productor / Comercio</span>
                            <div class="p-ro">{selected.productor}</div>
                            <p class="p-calc">Este campo se calcula al guardar</p>
                        </div>

                        <div>
                            <span class="p-label">Coordenadas</span>
                            <div class="p-coords">
                                <div>
                                    <label class="p-label p-sublabel" for="est-edit-lat">Latitud</label>
                                    <input
                                        id="est-edit-lat"
                                        class={editLatClass}
                                        type="text"
                                        inputmode="decimal"
                                        data-field="lat"
                                        value={editLat}
                                        oninput={handleEditInput}
                                    />
                                    <template if:true={editLatError}>
                                        <p class="p-err">{editLatError}</p>
                                    </template>
                                </div>
                                <div>
                                    <label class="p-label p-sublabel" for="est-edit-lng">Longitud</label>
                                    <input
                                        id="est-edit-lng"
                                        class={editLngClass}
                                        type="text"
                                        inputmode="decimal"
                                        data-field="lng"
                                        value={editLng}
                                        oninput={handleEditInput}
                                    />
                                    <template if:true={editLngError}>
                                        <p class="p-err">{editLngError}</p>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <div>
                            <span class="p-label">Vigente</span>
                            <button
                                type="button"
                                class="p-checkrow"
                                role="checkbox"
                                aria-checked={editVigenteAria}
                                data-field="vigente"
                                onclick={toggleEditVigente}
                            >
                                <span class={editVigenteClass} aria-hidden="true">
                                    <template if:true={editVigente}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                                    </template>
                                </span>
                                Vigente
                            </button>
                        </div>
                    </div>

                    <template if:true={editSaveError}>
                        <p class="p-alert" role="alert">{editSaveError}</p>
                    </template>
                </div>

                <footer class="p-mfoot">
                    <button type="button" class="btn ghost" onclick={closeEdit} disabled={saving}>Cancelar</button>
                    <button type="button" class="btn ghost" onclick={handleSaveAndNew} disabled={saving}>Guardar y nuevo</button>
                    <button type="button" class="btn btn-main" onclick={handleSave} disabled={saving}>{saveLabel}</button>
                </footer>
            </section>
        </div>
    </template>

    <c-establecimientos-map onsaved={handleEstablecimientoSaved}></c-establecimientos-map>
</template>
