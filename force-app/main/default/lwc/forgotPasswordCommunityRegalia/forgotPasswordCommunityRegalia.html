<template>
    <div class="stage">
        <div class="bg-rings">
            <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <circle cx="200" cy="640" r="320" fill="none" stroke="#00C776" stroke-width="1"/>
                <circle cx="200" cy="640" r="240" fill="none" stroke="#00C776" stroke-width="1"/>
                <circle cx="200" cy="640" r="160" fill="none" stroke="#00C776" stroke-width="1"/>
                <circle cx="200" cy="640" r="80" fill="none" stroke="#00C776" stroke-width="1"/>
            </svg>
        </div>

        <header class="header">
            <div class="logo">
                <span class="logo-mark">
                    <svg width="36" height="26" viewBox="0 0 60 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 32 Q30 -2 55 32" stroke="#00C776" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <path d="M18 36 L30 12 L42 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <path d="M28 24 L32 24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M27 38 L29 32" stroke="#00C776" stroke-width="2" stroke-linecap="round"/>
                        <path d="M31 38 L33 32" stroke="#00C776" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="logo-text">Ar<b>POV</b></span>
            </div>
        </header>

        <main class="content">
            <section class="tagline">
                <div class="eyebrow">Recuperación de acceso</div>
                <h1 class="headline">¿Perdiste<br/>tu <span class="green">contraseña?</span></h1>
                <p class="subhead">Sin problema. Recuperá el acceso en menos de un minuto.</p>
            </section>

            <form class="form-card" onsubmit={handleSubmit}>
                <a class="back-link" href="#" onclick={handleBackToLogin}>← Volver</a>
                <h2 class="form-title">Restablecer contraseña</h2>
                <p class="form-sub">Te enviaremos un enlace de recuperación al email asociado a tu cuenta.</p>

                <div class="field">
                    <label for="email">Email registrado</label>
                    <div class="input-wrap">
                        <lightning-icon 
                            icon-name="utility:email" 
                            size="x-small" 
                            class="icon">
                        </lightning-icon>
                        <input 
                            class="input" 
                            id="email" 
                            type="email" 
                            placeholder="vos@correo.com" 
                            value={email}
                            oninput={handleEmailChange}
                            required />
                    </div>
                </div>

                <button class="btn btn-accent" type="submit">Enviar enlace</button>

                <p class="help-text">
                    Si no encontrás el correo asociado, comunicate con la administración.
                </p>
            </form>
        </main>
    </div>
</template>
