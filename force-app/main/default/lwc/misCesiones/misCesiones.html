<template>
    <c-se-list-page loading={loading}>
        <c-se-page-header
            slot="header"
            eyebrow="CESIONES"
            eyebrow-mobile="MÓDULOS · CESIONES"
            title="Mis Cesiones"
            subtitle="Cesiones de toneladas del productor. Filtrá por estado, cultivo o tipo."
            show-search
            search-placeholder="Buscar cesión..."
            onsearchchange={handleSearchChange}
        ></c-se-page-header>

        <div slot="toolbar" class="ces-toolbar">
            <div class="ces-new-actions se-desk-only">
                <button
                    type="button"
                    class="ces-new-btn"
                    data-type="Explotacion Conjunta"
                    onclick={handleNewCesion}
                >Nueva cesión · Explotación Conjunta</button>
                <button
                    type="button"
                    class="ces-new-btn ces-new-btn--alt"
                    data-type="Semilla Original"
                    onclick={handleNewCesion}
                >Nueva cesión · Semilla Original</button>
            </div>
            <c-se-filter-pills items={statusPills} onselect={handlePill}></c-se-filter-pills>
        </div>

        <div slot="filters">
            <c-se-select
                options={cultivoOptions}
                value={cultivoSeleccionado}
                placeholder="Todos los cultivos"
                onchange={handleCultivo}
            ></c-se-select>
            <c-se-select
                options={tipoOptions}
                value={tipoSeleccionado}
                placeholder="Todos los tipos"
                onchange={handleTipo}
            ></c-se-select>
        </div>

        <c-se-data-list
            records={filtered}
            columns={columns}
            mobile-fields={mobileFields}
            title-field="name"
            badge-field="statusLabel"
            badge-tone-field="statusTone"
            key-field="id"
            action-label="Ver"
            mobile-action-label="Ver cesión →"
            empty-text="No hay cesiones para mostrar."
            page-size={pageSize}
            loading={loading}
            onrowaction={handleRowAction}
        ></c-se-data-list>
    </c-se-list-page>

    <button type="button" class="ces-fab se-mob-only" onclick={openNewSheet} aria-label="Nueva cesión">
        <span aria-hidden="true">+</span>
    </button>

    <div class={newSheetClass} role="presentation">
        <button type="button" class="se-new-sheet-scrim" onclick={closeNewSheet} aria-label="Cerrar"></button>
        <div class="se-new-sheet" role="dialog" aria-modal="true" aria-labelledby="ces-new-title">
            <div class="se-new-sheet-handle" aria-hidden="true"></div>
            <h2 id="ces-new-title" class="se-new-sheet-title">Nueva cesión</h2>
            <p class="se-new-sheet-sub">Elegí el tipo de cesión de toneladas.</p>
            <button
                type="button"
                class="ces-new-btn ces-new-btn--sheet"
                data-type="Explotacion Conjunta"
                onclick={handleNewCesion}
            >Explotación Conjunta</button>
            <button
                type="button"
                class="ces-new-btn ces-new-btn--sheet"
                data-type="Semilla Original"
                onclick={handleNewCesion}
            >Semilla Original</button>
            <button type="button" class="ces-new-cancel" onclick={closeNewSheet}>Cancelar</button>
        </div>
    </div>
</template>
