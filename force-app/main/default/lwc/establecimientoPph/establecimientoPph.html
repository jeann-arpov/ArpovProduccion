<template>
    <article class={blockClass}>
        <header class="p-block-h">
            <span class="t">
                <small>Establecimiento</small>
                <template if:true={headerName}>{headerName}</template>
            </span>
            <button type="button" class="p-icon-btn inv" aria-label="Eliminar establecimiento" title="Eliminar establecimiento" onclick={remove}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"></path></svg>
            </button>
        </header>

        <section class="p-sec">
            <p class="p-step"><span class="n">1</span>Para comenzar seleccioná un establecimiento ya creado:</p>

            <div class="p-pick">
                <template if:true={hasEstablecimiento}>
                    <div class="p-selected">
                        <span class="pin">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
                        </span>
                        <span class="nm">{establecimiento.Name}</span>
                        <button type="button" class="x" aria-label="Quitar establecimiento" title="Quitar establecimiento" onclick={handleClearSelection}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                        </button>
                    </div>
                </template>

                <template if:false={hasEstablecimiento}>
                    <div class="p-search">
                        <input
                            class="p-input"
                            type="search"
                            autocomplete="off"
                            placeholder="Ingresá nombre del establecimiento"
                            aria-label="Buscar establecimiento"
                            value={searchTerm}
                            oninput={handleSearchInput}
                        />
                        <span class="ic" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
                        </span>
                    </div>
                    <template if:true={showDropdown}>
                        <div class="p-dd" role="listbox">
                            <template for:each={searchResults} for:item="result">
                                <button key={result.id} type="button" class="p-dd-item" role="option" data-id={result.id} onclick={handleSelectResult}>
                                    <span class="pin">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
                                    </span>
                                    <span class="txt"><b>{result.title}</b><span>{result.subtitle}</span></span>
                                </button>
                            </template>
                            <template if:true={noResults}>
                                <div class="p-dd-empty">
                                    <b>Establecimiento no registrado</b>
                                    <span>Recordá que los establecimientos deben estar marcados como vigentes para poder seleccionarlos en esta pantalla.</span>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>
            </div>

            <p class="p-help">
                Para editar el nombre o las coordenadas de un establecimiento existente, podés ir a
                <a href={establecimientosUrl} target="_blank">Precertificación &gt; Mis establecimientos</a>
            </p>

            <template if:true={showCrear}>
                <p class="p-or">O creá un establecimiento nuevo:</p>
                <div class="p-fields">
                    <div>
                        <label class="p-label" for="nombre">Nombre<span class="req">*</span></label>
                        <input
                            id="nombre"
                            class={nameClass}
                            type="text"
                            value={name}
                            oninput={updateName}
                            onfocus={handleFocus}
                            onblur={handleBlur}
                        />
                        <template if:true={nameError}>
                            <p class="p-err" role="alert">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
                                <span>{nameError}</span>
                            </p>
                        </template>
                    </div>
                    <div>
                        <span class="p-label">Georreferencia<span class="req">*</span></span>
                        <button type="button" class={geoClass} onclick={showMap}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
                            <template if:true={hasCoordinates}>
                                <span class="v">{mapCoordinates}</span>
                            </template>
                            <template if:false={hasCoordinates}>
                                <span>Seleccionar punto de lote</span>
                            </template>
                        </button>
                        <template if:true={geoError}>
                            <p class="p-err" role="alert">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
                                <span>{geoError}</span>
                            </p>
                        </template>
                    </div>
                </div>
            </template>
        </section>

        <section class={infoClass}>
            <div class="p-ha-col">
                <div class={haWrapClass}>
                    <div class="p-ha">
                        <span class="k"><b>Hectáreas Sembrá Evolución</b>{haCaption}</span>
                        <span class="v">{totalHtLabel}</span>
                    </div>
                    <button type="button" class="btn btn-buy" disabled={disabled} title="Si te faltaron HT podés comprarlas ahora" onclick={redirectCompraHT}>
                        Comprar hectáreas
                    </button>
                </div>
            </div>

            <div class="p-main">
                <div class="p-area">
                    <p class="p-step"><span class="n">2</span>{step2Label}</p>
                    <template if:true={showVariedades}>
                        <div class="p-vhead" aria-hidden="true">
                            <span>Marca</span>
                            <span>Variedad</span>
                            <span>Hectáreas</span>
                            <span class="r">HT disponibles</span>
                        </div>
                    </template>
                    <div class={vlistClass}>
                        <template for:each={info.lineas} for:item="linea">
                            <c-variedad-pph
                                key={linea.id}
                                info={linea}
                                onupdatecantidad={updateCantidad}
                                onautosave={autosave}
                            ></c-variedad-pph>
                        </template>
                    </div>
                    <template if:false={showVariedades}>
                        <div class="p-empty">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"></path><path d="M12 9c0-3 2-5 5-5 0 3-2 5-5 5zM12 9c0-3-2-5-5-5 0 3 2 5 5 5z"></path></svg>
                            <span>Marca · Variedad · Hectáreas · HT disponibles</span>
                        </div>
                    </template>
                </div>

                <div class="p-area">
                    <p class="p-step"><span class="n">3</span>{step3Label}</p>
                    <label class="p-label" for="nose">Hectáreas que NO utilizan Sembrá Evolución<span class="req">*</span></label>
                    <input
                        id="nose"
                        class={noSEClass}
                        type="number"
                        inputmode="numeric"
                        min="0"
                        step="1"
                        placeholder="Indicá cantidad de hectáreas"
                        value={cantidadNoSEInput}
                        oninput={updateCantidadFuera}
                        onfocus={handleFocus}
                        onblur={handleBlur}
                    />
                    <template if:true={noSEError}>
                        <p class="p-err" role="alert">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
                            <span>{noSEError}</span>
                        </p>
                    </template>
                </div>
            </div>
        </section>

        <div class="p-collapse">
            <button type="button" aria-label={collapseLabel} title={collapseLabel} onclick={changeCollapsed}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d={chevronPath}></path></svg>
            </button>
        </div>
    </article>
</template>
