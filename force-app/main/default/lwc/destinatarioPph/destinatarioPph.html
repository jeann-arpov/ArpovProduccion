<template>
    <div class={destinatarioClass}>
        <template if:true={showDestinatarioBlock}>
            <template if:true={isWizardVariant}>
                <p class="se-field-label">Destinatario</p>

                <template if:true={hasDestinatario}>
                    <div
                        role="button"
                        tabindex="0"
                        class="se-choice-card is-selected"
                        onclick={openDestinatarioSearch}
                        onkeydown={handleDestCardKeydown}
                    >
                        <span class="se-choice-body">
                            <span class="se-choice-title">{destinatarioDisplayName}</span>
                            <span class="se-choice-sub">{destinatarioDisplayCuit}</span>
                        </span>
                    </div>
                </template>

                <template if:false={hasDestinatario}>
                    <div class="se-choice-card se-choice-card--search">
                        <c-lookup
                            variant="label-hidden"
                            onselectionchange={destinatarioSelected}
                            onsearch={search}
                            label="Productor"
                            placeholder="CUIT o razón social"
                            selection={destinatario}
                        >
                            <div slot="no-results">
                                <span class="dest-cuit-miss">CUIT NO REGISTRADO</span>
                                <div class="dest-cuit-help">
                                    Los CUITs habilitados para operar en la plataforma son los que se encuentran dados de alta en el sistema de información simplificado agrícola (SISA) de AFIP.
                                </div>
                                <li role="presentation" class="slds-listbox__item">
                                    <div
                                        class="slds-media slds-media_center slds-listbox__option slds-listbox__option_entity"
                                        onclick={registerCuit}
                                        role="option"
                                    >
                                        <span class="slds-media__figure slds-listbox__option-icon">
                                            <lightning-icon
                                                icon-name="utility:add"
                                                size="x-small"
                                                alternative-text="Registrar CUIT"
                                            ></lightning-icon>
                                        </span>
                                        <span class="slds-media__body">
                                            <span class="dest-cuit-miss slds-listbox__option-text">Registrar CUIT</span>
                                        </span>
                                    </div>
                                </li>
                            </div>
                        </c-lookup>
                    </div>
                </template>
            </template>

            <template if:false={isWizardVariant}>
                <div class="dest-head">
                    <b>Ingresá el CUIT del productor que recibirá las toneladas</b>
                    <template if:true={allowRemove}>
                        <lightning-button-icon
                            size="large"
                            class="dest-remove"
                            icon-name="utility:delete"
                            variant="bare"
                            alternative-text="Eliminar destinatario"
                            title="Eliminar destinatario"
                            onclick={remove}
                        ></lightning-button-icon>
                    </template>
                </div>

                <div class="dest-lookup">
                    <c-lookup
                        variant="label-hidden"
                        onselectionchange={destinatarioSelected}
                        onsearch={search}
                        label="Productor"
                        placeholder="Ingrese CUIT del productor"
                        selection={destinatario}
                    >
                        <div slot="no-results">
                            <span class="dest-cuit-miss">CUIT NO REGISTRADO</span>
                            <div class="dest-cuit-help">
                                Los CUITs habilitados para operar en la plataforma son los que se encuentran dados de alta en el sistema de información simplificado agrícola (SISA) de AFIP.
                            </div>
                            <li role="presentation" class="slds-listbox__item">
                                <div
                                    class="slds-media slds-media_center slds-listbox__option slds-listbox__option_entity"
                                    onclick={registerCuit}
                                    role="option"
                                >
                                    <span class="slds-media__figure slds-listbox__option-icon">
                                        <lightning-icon
                                            icon-name="utility:add"
                                            size="x-small"
                                            alternative-text="Registrar CUIT"
                                        ></lightning-icon>
                                    </span>
                                    <span class="slds-media__body">
                                        <span class="dest-cuit-miss slds-listbox__option-text">Registrar CUIT</span>
                                    </span>
                                </div>
                            </li>
                        </div>
                    </c-lookup>
                </div>
            </template>
        </template>

        <template if:true={showToneladasBlock}>
            <template if:true={showWizardToneladas}>
                <div class="se-saldo-card">
                    <div class="se-saldo-copy">
                        <span class="se-saldo-label">Saldo {cultivoLabel}</span>
                        <span class="se-saldo-sub">disponible para ceder</span>
                    </div>
                    <span class="se-saldo-value">{saldoDisponibleLabel}</span>
                </div>

                <p class="se-field-label">Toneladas a ceder por variedad</p>
                <template if:true={hasWizardLineas}>
                    <div class="se-var-list">
                        <template for:each={wizardLineas} for:item="linea">
                            <div key={linea.id} class={linea.rowClass}>
                                <div class="se-var-copy">
                                    <span class="se-var-brand">{linea.brand}</span>
                                    <span class="se-var-name">{linea.name}</span>
                                    <span class="se-var-disp">Disponible: {linea.disponibleLabel} t</span>
                                </div>
                                <div class={linea.inputWrapClass}>
                                    <input
                                        class="se-var-input"
                                        type="text"
                                        inputmode="decimal"
                                        placeholder="0"
                                        data-id={linea.id}
                                        value={linea.input}
                                        aria-label={linea.ariaLabel}
                                        aria-invalid={linea.ariaInvalid}
                                        oninput={handleLineaInput}
                                        onblur={handleLineaBlur}
                                    />
                                    <span class="se-ton-suffix">t</span>
                                </div>
                                <template if:true={linea.hasError}>
                                    <p class="se-var-err" role="alert">
                                        <span class="se-ton-error-icon" aria-hidden="true">!</span>
                                        Superás el saldo de esta variedad (máx. {linea.disponibleLabel} t).
                                    </p>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="se-var-total">
                        <span>Total a ceder</span>
                        <strong>{wizardTotalLabel} t</strong>
                    </div>
                </template>
                <template if:false={hasWizardLineas}>
                    <div class="se-var-empty">No tenés toneladas disponibles para ceder en este cultivo.</div>
                </template>

                <div class="se-resumen-card">
                    <p class="se-resumen-eyebrow">Resumen</p>
                    <div class="se-resumen-row">
                        <span class="se-resumen-label">Destinatario</span>
                        <strong class="se-resumen-value">{destinatarioDisplayName}</strong>
                    </div>
                    <div class="se-resumen-row">
                        <span class="se-resumen-label">Contrato</span>
                        <strong class="se-resumen-value">{contratoTitle}</strong>
                    </div>
                </div>
            </template>

            <template if:false={showWizardToneladas}>
            <div class={infoClass}>
                <div class="heading gray ton-head">
                    <span>Detallá las toneladas a ceder de SEMBRÁ EVOLUCIÓN</span>
                </div>

                <div class="variedades">
                    <div class="var-head">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17.75" height="15.531">
                            <use xlink:href={icons.seed}></use>
                        </svg>
                        Variedades
                    </div>
                    <lightning-layout
                        vertical-align="center"
                        horizontal-align="space"
                        class="slds-text-align_center variedades-titles se-desk-only"
                    >
                        <lightning-layout-item size="2">Marca</lightning-layout-item>
                        <lightning-layout-item size="2">Variedad</lightning-layout-item>
                        <lightning-layout-item size="2">Toneladas</lightning-layout-item>
                        <lightning-layout-item size="1" title="Saldo de Toneladas disponibles">
                            Toneladas Disponibles
                        </lightning-layout-item>
                    </lightning-layout>

                    <template for:each={info.lineas} for:item="linea">
                        <c-linea-destinatario-pph
                            key={linea.id}
                            info={linea}
                            onupdatecantidad={updateCantidad}
                            onautosave={autosave}
                        ></c-linea-destinatario-pph>
                    </template>
                </div>
            </div>

            <lightning-layout horizontal-align="center" class="se-desk-only">
                <lightning-button-icon
                    size="large"
                    if:false={collapsed}
                    icon-name="utility:chevronup"
                    variant="bare"
                    alternative-text="Colapsar"
                    title="Colapsar"
                    onclick={changeCollapsed}
                ></lightning-button-icon>
                <lightning-button-icon
                    size="large"
                    if:true={collapsed}
                    icon-name="utility:chevrondown"
                    variant="bare"
                    alternative-text="Expandir"
                    title="Expandir"
                    onclick={changeCollapsed}
                ></lightning-button-icon>
            </lightning-layout>
            </template>
        </template>
    </div>
</template>
