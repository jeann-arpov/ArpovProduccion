<template>
    <div class="se-header">
        <div class="topbar">
            <button class="icon-btn" type="button" aria-label="Abrir menú" onclick={openDrawer}>
                <span class="hamburger" aria-hidden="true"></span>
            </button>
            <a class="logo" href="#" data-page="" onclick={handleNavigate}>
                <img src={logoUrl} alt="Sembrá Evolución" />
            </a>
            <button class="avatar-btn" type="button" aria-label="Cuenta" onclick={openDrawer}>
                {userInitial}
            </button>
        </div>

        <div class="desktop">
            <div class="prenav">
                <div class="content">
                    <div class="platform">
                        <a if:true={isDistribuidor} href={comercioUrl}>Ir a plataforma comercios</a>
                    </div>
                    <div class="usernav">
                        <span class="accbtn" if:true={accountName}>{accountName}</span>
                        <div class={userMenuClass}>
                            <button class="userbtn" type="button" aria-haspopup="true" onclick={toggleUserMenu}>
                                {userName}
                                <span class="caret" aria-hidden="true"></span>
                            </button>
                            <div class="submenu" role="menu">
                                <a href="#" data-page="editarperfil" onclick={handleProfile}>Editar perfil</a>
                            </div>
                        </div>
                        <button class="icon-btn logout" type="button" aria-label="Cerrar sesión" onclick={handleCommunityLogout}>
                            <span class="logout-mark" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="mainav">
                <div class="content">
                    <a class="logo logo-desktop" href="#" data-page="" onclick={handleNavigate}>
                        <img src={logoUrl} alt="Sembrá Evolución" />
                    </a>
                    <nav aria-label="Principal">
                        <template for:each={navItemsView} for:item="item">
                            <div key={item.id} class={item.itemClass}>
                                <template if:true={item.hasSubmenu}>
                                    <button type="button" data-id={item.id} aria-expanded={item.openAria} onclick={toggleSubmenu}>
                                        {item.label}
                                    </button>
                                    <div class="submenu">
                                        <template for:each={item.submenu} for:item="sub">
                                            <a key={sub.id} href="#" data-page={sub.url} onclick={handleNavigate}>{sub.label}</a>
                                        </template>
                                    </div>
                                </template>
                                <template if:false={item.hasSubmenu}>
                                    <a href="#" data-page={item.url} onclick={handleNavigate}>{item.label}</a>
                                </template>
                            </div>
                        </template>
                    </nav>
                </div>
            </div>
        </div>

        <div class={drawerClass}>
            <div class="backdrop" onclick={closeDrawer}></div>
            <aside class="panel" role="dialog" aria-modal="true" aria-label="Menú">
                <div class="panel-head">
                    <div class="panel-user">
                        <span class="avatar-btn" aria-hidden="true">{userInitial}</span>
                        <div>
                            <div class="panel-name">{userName}</div>
                            <div class="panel-account" if:true={accountName}>{accountName}</div>
                        </div>
                    </div>
                    <button class="icon-btn light" type="button" aria-label="Cerrar menú" onclick={closeDrawer}>
                        <span class="close-mark" aria-hidden="true"></span>
                    </button>
                </div>
                <nav class="panel-nav">
                    <template for:each={drawerLinksView} for:item="link">
                        <a key={link.id} class={link.itemClass} href="#" data-page={link.url} onclick={handleNavigate}>
                            {link.label}
                        </a>
                    </template>
                </nav>
                <a if:true={isDistribuidor} class="drawer-link" href={comercioUrl}>Ir a plataforma comercios</a>
                <button class="drawer-logout" type="button" onclick={handleCommunityLogout}>Cerrar sesión</button>
            </aside>
        </div>
    </div>
</template>
