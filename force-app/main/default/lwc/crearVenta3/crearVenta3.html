<template>
  <!-- PASOS (cuando aún no se muestra el resumen) -->
  <template if:false={showResumen}>
    <div class="container">
      <!-- Paso 1: Cultivo -->
      <div class={step1Class}>
        <div class="step-header" data-step="1" onclick={handleStepClick}>
          <div class="step-circle">1</div>
          <div class="step-label">Seleccionar Cultivo</div>
        </div>
        <template if:true={isStep1Active}>
          <div class="step-content">
            <template for:each={decoratedCultivos} for:item="c">
              <div
                key={c.nombre}
                class={c.cssClass}
                data-nombre={c.nombre}
                data-id={c.id}
                onclick={handleSelectCultivo}
              >
                <div class="cultivo-card">
                  <img src={c.icono} alt="" class="cultivo-icon" />
                </div>
                <div class="cultivo-divider"></div>
                <div class="cultivo-label">{c.nombre}</div>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Paso 2: Productor -->
      <div class={step2Class}>
        <div class="step-header" data-step="2" onclick={handleStepClick}>
          <div class="step-circle">2</div>
          <div class="step-label">Seleccionar Productor</div>
        </div>
        <template if:true={isStep2Active}>
          <div class="step-content vertical">
            <c-lookup
              variant="label-hidden"
              required
              onselectionchange={productorSelected}
              onsearch={search}
              label="Productor"
              class="custom-combobox"
              placeholder="Ingrese CUIT del productor"
            >
              <div slot="no-results">
                <span style="color: #ff0000; font-size: 18px"
                  >CUIT NO REGISTRADO</span
                >
                <div style="color: #1c1c1c; font-size: 14px">
                  Los CUITs habilitados para operar en la plataforma son los que
                  se encuentran dados de alta en el sistema de información
                  simplificado agrícola (SISA) de AFIP.
                </div>
                <div style="color: #1c1c1c; font-size: 14px">
                  Por favor póngase en contacto con la mesa de ayuda de Sembrá
                  Evolución
                </div>
              </div>
            </c-lookup>
          </div>
        </template>
      </div>

      <!-- Paso 3: Marca -->
      <div class={step3Class}>
        <div class="step-header" data-step="3" onclick={handleStepClick}>
          <div class="step-circle">3</div>
          <div class="step-label">Seleccionar Marca</div>
        </div>
        <template if:true={isStep3Active}>
          <div class="step-content vertical">
            <c-semillero-data-new
              placeholder="Seleccionar marca"
              disabled={productorMissing}
              missing-confirm-data={missingConfirmData}
              semilleros={semilleros}
              semillero-data={semilleroData}
              onopencondicionescomerciales={openCondicionesComerciales}
              onsemilleroselected={semilleroSelected}
              onsemilleroselectedejecuto={semilleroSelectedEjecuto}
              onconfirm={confirm}
              onredirectmislicencias={redirectMisLicencias}
            >
            </c-semillero-data-new>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- RESUMEN / FORMULARIO PRINCIPAL -->
  <template if:true={showResumen}>
    <!-- Componente oculto (para levantar ícono/semillero) -->
    <div class="step-content vertical" style="display: none">
      <c-semillero-data-new
        data-id="semilleroComponent"
        placeholder="Seleccionar marca"
        disabled={productorMissing}
        missing-confirm-data={missingConfirmData}
        semilleros={semilleros}
        semillero-data={semilleroData}
        onopencondicionescomerciales={openCondicionesComerciales}
        onsemilleroselected={semilleroSelected}
        onsemilleroiconready={handleSemilleroIconReady}
        onconfirm={confirm}
        onredirectmislicencias={redirectMisLicencias}
      >
      </c-semillero-data-new>
    </div>

    <!-- Header con logo y datos -->
    <div class="venta-header">
      <div class="header-logo">
        <svg width="150" height="75" viewBox="0 0 200 100">
          <use xlink:href={semilleroIcono}></use>
        </svg>
      </div>
      <div class="header-main">
        <div class="header-cards">
          <div class="info-card">
            <label>VENTA HT</label>
            <div>{nombreVenta}</div>
          </div>
          <div class="info-card">
            <label>CULTIVO</label>
            <div>{cultivoNombre}</div>
          </div>
          <div class="info-card">
            <label>PRODUCTOR</label>
            <div>{productorNombre}</div>
          </div>
          <div class="info-card" if:true={mostrarVentaOriginal}>
            <label>VENTA ORIGINAL</label>
            <div>{ventaOriginalName}</div>
          </div>
          <div class="info-card">
            <label>CUIT NRO.</label>
            <div>{cuit}</div>
          </div>
          <div class="info-card" if:true={comercioNombre}>
            <label>COMERCIO</label>
            <div>{comercioNombre}</div>
          </div>
          <div class="info-card">
            <label>ESTADO</label>
            <div class="badge-estado-venta {estadoVentaClass}">
              {estadoVenta}
            </div>
          </div>
          <div class="info-card" if:true={mostrarColumnaTipoNC}>
            <label>TIPO NC</label>
            <div class="badge-tipo-nc {tipoNotaCreditoClass}">
              {tipoNotaCredito}
            </div>
          </div>
        </div>
      </div>
      <div class="header-btn">
        <button class="btn-comercial" onclick={openCondicionesComerciales}>
          <img src={iconCondicionesHTUrl} alt="" class="icon-svg" /> CONDICIONES
          COMERCIALES
        </button>
      </div>
    </div>

    <!-- ===== NOTAS DE CRÉDITO RELACIONADAS ===== -->
    <div
      if:true={mostrarNCRelacionadas}
      class="nc-relacionadas-container slds-m-bottom_medium"
    >
      <div class="slds-notice slds-notice_info">
        <div class="slds-notice__content">
          <div class="slds-grid slds-grid_vertical-align-center">
            <div class="slds-col">
              <strong>Notas de Crédito Relacionadas</strong>
            </div>
          </div>
          <table class="nc-relacionadas-table">
            <thead>
              <tr>
                <th>NC</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template for:each={ncRelacionadas} for:item="nc">
                <tr key={nc.id}>
                  <td>{nc.name}</td>
                  <td>{nc.tipoLabel}</td>
                  <td>
                    <span class="estado-badge estado-{nc.estadoClass}"
                      >{nc.estado}</span
                    >
                  </td>
                  <td>{nc.fecha}</td>
                  <td>
                    <lightning-button
                      label="Ver"
                      variant="base"
                      class="btn-ver-nc"
                      data-id={nc.id}
                      onclick={navegarANotaCredito}
                      title="Ver {nc.name}"
                    >
                    </lightning-button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <!-- Card de variedades -->
    <div class="variedades-card">
      <!-- Header de tabla -->
      <div class="variedades">
        <lightning-layout
          vertical-align="center"
          class="slds-m-bottom_medium slds-text-align_center"
        >
          <lightning-layout-item size="1" padding="horizontal-small">
            <b if:false={finalizada}>Seleccioná&nbsp;</b>
            <b>Variedad</b>
          </lightning-layout-item>

          <lightning-layout-item size="2" padding="horizontal-small">
            <b if:false={finalizada}
              >Seleccione tipo de HT según momento de entrega del grano</b
            >
            <b if:true={finalizada}>Tipo de HT segun Momento</b>
            <div if:false={finalizada} class="tooltip-wrapper">
              <a class="c-tooltip" style="padding: 3px">
                <lightning-icon
                  icon-name="utility:info"
                  size="small"
                ></lightning-icon>
              </a>
              <div class="tooltipContainer">
                <div class="help-header">
                  <b>¿Qué significa HT Disponible?</b>
                </div>
                <p class="help-text">{labels.htDisponibles}</p>
                <div class="help-header"><b>¿Qué significa HT Futura?</b></div>
                <p class="help-text">{descripcionHtFuturas}</p>
              </div>
            </div>
          </lightning-layout-item>
          <!--
                    <template if:true={showFinanciamientoColumn}>
                        <lightning-layout-item size="1" padding="horizontal-small">
                            <b>Tipo de Financiamiento</b>
                        </lightning-layout-item>
                    </template>-->

          <lightning-layout-item size="1" padding="horizontal-small">
            <b>Fecha de Conversión a Toneladas</b>
          </lightning-layout-item>
          <lightning-layout-item size="1" padding="horizontal-small">
            <b>Cantidad HT</b>
          </lightning-layout-item>
          <lightning-layout-item size="1" padding="horizontal-small">
            <b>Precio Unitario (USD)</b>
          </lightning-layout-item>
          <lightning-layout-item size="1" padding="horizontal-small">
            <b>Total (USD)</b>
          </lightning-layout-item>
          <lightning-layout-item size="1" padding="horizontal-small">
            <b>Estado</b>
          </lightning-layout-item>
          <lightning-layout-item size="1" padding="horizontal-small">
            <b>Licencia</b>
          </lightning-layout-item>
          <!-- ===== NUEVA COLUMNA: CAMPOS DE AJUSTE ===== -->
          <lightning-layout-item
            if:true={modoNotaCreditoPrecio}
            size="1"
            padding="horizontal-small"
          >
            <b>{labels.ncNewPriceLabel}</b>
            <!-- ✅ USAR LABEL -->
          </lightning-layout-item>

          <lightning-layout-item
            if:true={modoNotaCreditoCantidad}
            size="1"
            padding="horizontal-small"
          >
            <b>{labels.ncNewQualityLabel}</b>
            <!-- ✅ USAR LABEL -->
          </lightning-layout-item>
          <!-- ===== NUEVA COLUMNA: OBSERVACIONES OBLIGATORIAS ===== -->
          <lightning-layout-item
            if:true={mostrarCamposNotaCredito}
            size="1"
            padding="horizontal-small"
          >
            <b>{labels.ncObservacionesLabel}</b>
          </lightning-layout-item>
          <!-- Agregar esta columna en el header de la tabla -->
          <lightning-layout-item
            if:true={mostrarCamposNotaCredito}
            size="1"
            padding="horizontal-small"
          >
            <b>{labels.ncSelectLabel}</b>
            <!-- ✅ USAR LABEL -->
          </lightning-layout-item>
        </lightning-layout>
      </div>

      <!-- En las filas dinámicas, pasar las propiedades a los componentes hijos -->
      <template for:each={items} for:item="item" for:index="index">
        <c-crear-linea-venta-new3
          key={item.id}
          record={item.record}
          factura={item.factura}
          index={item.id}
          price-book-entries={variedades}
          show-financiamiento={showFinanciamientoColumn}
          cultivo-seleccionado={cultivoNombre}
          modo-nota-credito-precio={modoNotaCreditoPrecio}
          modo-nota-credito-cantidad={modoNotaCreditoCantidad}
          onloadingchange={handleLoadingChange}
          ondelete={removeRow}
          onrecord={updateRecord}
          onsave={saveRow}
          onopenfactura={openFactura}
          onopenmodal={handleOpenModal}
          ontipohtchange={handleTipoHtChange}
          oncheckboxchange={handleCheckboxChange}
          onpreciochange={handlePrecioChange}
          oncantidadchange={handleCantidadChange}
          onobservacioneschange={handleObservacionesChange}
        >
          <!-- NUEVO EVENTO -->>
        </c-crear-linea-venta-new3>
      </template>

      <!-- Botón agregar -->
      <div class="acciones-variedad" if:true={puedeAgregarVariedad}>
        <button type="button" onclick={addRow} class="add-variedad">
          <span class="plus-sign">+</span> {labels.ncAddVariety}
        </button>
      </div>

      <!-- Totales -->
      <div class="totales" if:true={data.record}>
        <div class="col col-2">TOTALES</div>
        <div class="col col-2"></div>
        <div class="col col-2"></div>
        <div class="col col-1">{data.record.Total_HT__c} HT</div>
        <div class="col col-1">{data.record.Total_USD__c} USD</div>
        <div class="col col-4 text-right">
          <button
            if:true={puedeFinalizar}
            class="finalizar-btn"
            onclick={finalizar}
          >
            {labels.ncFinalizeSale} ➞
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- FOOTER BOTONES -->
  <lightning-layout class="slds-m-top_large footer" horizontal-align="center">
    <lightning-layout-item>
      <template if:false={created}>
        <lightning-button
          onclick={close}
          variant="brand"
          class="slds-m-top_medium slds-m-left--medium new circle"
          type="submit"
          label={closeLabel}
        >
        </lightning-button>

        <lightning-button
          if:true={mostrarVentaOriginal}
          variant="brand"
          onclick={navegarAVentaOriginal}
          class="slds-m-top_medium slds-m-left--medium new circle"
          type="submit"
          label="Volver a venta original"
        >
        </lightning-button>

        <lightning-button
          if:true={puedeAnular}
          variant="brand"
          onclick={showAnularConfirm}
          class="slds-m-top_medium slds-m-left--medium new circle"
          type="submit"
          label={labels.ncAnularButton}
        >
          <!-- ✅ USAR LABEL -->
        </lightning-button>

        <lightning-button
          if:true={puedeFacturar}
          variant="brand"
          onclick={facturar}
          class="slds-m-top_medium slds-m-left--medium facturar"
          type="submit"
          label={labels.ncFacturarButton}
        >
          <!-- ✅ USAR LABEL -->
        </lightning-button>

        <!-- ===== MENÚ DESPLEGABLE DE NOTAS DE CRÉDITO ===== -->
        <div if:true={mostrarMenuNC} class="dropdown-nc-wrapper">
          <lightning-button-menu
            label="Notas de Crédito"
            variant="brand"
            class="nota-credito"
            onselect={handleNCMenuSelect}
          >
            <lightning-menu-item
              if:true={tieneNCTotal}
              value="NC_Total"
              label={labels.ncTotalButton}
            >
            </lightning-menu-item>
            <lightning-menu-item
              if:true={tieneNCPrecio}
              value="NC_Precio"
              label={labels.ncButtonPrice}
            >
            </lightning-menu-item>
            <lightning-menu-item
              if:true={tieneNCCantidad}
              value="NC_Cantidad"
              label={labels.ncButtonQuantity}
            >
            </lightning-menu-item>
          </lightning-button-menu>
        </div>

        <lightning-button
          if:true={botonProcesarNCVisible}
          variant="brand"
          onclick={procesarNotaCreditoParcial}
          class="slds-m-top_medium slds-m-left--medium procesar-nc circle"
          type="submit"
          label={textoBotonProcesarNC}
        >
        </lightning-button>

        <lightning-button
          if:true={botonProcesarNCVisible}
          variant="neutral"
          onclick={cancelarNotaCredito}
          class="slds-m-top_medium slds-m-left--medium cancelar-nc circle"
          type="submit"
          label={labels.ncButtonCancel}
        >
          <!-- ✅ USAR LABEL -->
        </lightning-button>

        <lightning-button
          if:true={puedeRealizarNueva}
          variant="brand"
          onclick={redirectToNew}
          class="slds-m-top_medium slds-m-left--medium new circle"
          type="submit"
          label={labels.ncNewSale}
        >
          <!-- ✅ USAR LABEL -->
        </lightning-button>

        <!-- Mostrar SOLO si corresponde por cuenta y NO está pendiente -->
        <lightning-button
          if:true={mostrarFacturaYObs}
          variant="brand"
          onclick={openFileUpload}
          class="slds-m-top_medium slds-m-left--medium new circle"
          type="submit"
          label={labels.ncUploadInvoice}
        >
          <!-- ✅ USAR LABEL -->
        </lightning-button>

        <lightning-button
          if:true={mostrarFacturaYObs}
          variant="brand"
          onclick={handleInsertarObs}
          class="slds-m-top_medium slds-m-left--medium new circle"
          type="submit"
          label={labels.ncObservacionesButton}
        >
          <!-- ✅ USAR LABEL -->
        </lightning-button>
      </template>
    </lightning-layout-item>
  </lightning-layout>

  <!-- Spinner global -->
  <template if:true={isLoading}>
    <div class="exampleHolder">
      <lightning-spinner
        alternative-text="Loading"
        size="medium"
      ></lightning-spinner>
    </div>
  </template>

  <!-- Modal: Subir Factura -->
  <template if:true={showFileUploadModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <lightning-button-icon
            class="slds-modal__close"
            title="Cerrar"
            icon-name="utility:close"
            icon-class="slds-button_icon-inverse"
            onclick={closeFileUpload}
          >
          </lightning-button-icon>
          <h2 class="slds-text-heading_medium slds-hyphenate">Subir Factura</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <lightning-input
            type="date"
            label="Fecha de emisión del comprobante"
            value={formattedDate}
            onchange={handleDateChange}
          >
          </lightning-input>

          <lightning-input
            type="text"
            label="N° de Comprobante"
            value={customCode}
            onchange={handleCodeChange}
            pattern="^[ABC]-\d{4,5}-\d{8}$"
            message-when-pattern-mismatch="Formato inválido. Usa A/B/C-0000/00000-00000000."
          >
          </lightning-input>

          <lightning-file-upload
            label="Seleccionar archivo"
            name="fileUploader"
            accept={acceptedFormats}
            record-id={recordId}
            disabled={uploadFactura}
            onuploadfinished={handleUploadFinished}
          >
          </lightning-file-upload>
          <br />
          <center>
            <lightning-button
              label="Guardar"
              title="Guardar"
              onclick={handleSave}
              variant="brand"
              disabled={isLoading}
              class="slds-m-top_medium"
            >
            </lightning-button>
          </center>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- Modal informativo
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open custom-modal">
            <div class="slds-modal__container custom-modal-container">
                <header class="slds-modal__header modal-header">
                    <h2 class="slds-text-heading_medium">¡Atención!</h2>
                </header>
                <div class="slds-modal__content modal-content">
                    Este precio es válido solo para pago contado dentro del plazo definido.
                    Si no se cancela en término, la condición se pierde y la operación se revierte.
                </div>
                <footer class="slds-modal__footer modal-footer">
                    <lightning-button class="slds-modal__close"
                                      variant="brand"
                                      label="Cerrar"
                                      onclick={closeModal}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>-->

  <!-- Modal -->
  <template if:true={isOpen}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="modal-heading"
      class="slds-modal slds-fade-in-open"
      onkeydown={handleKeydown}
    >
      <div class="slds-modal__container">
        <!-- Header -->
        <header class="slds-modal__header slds-p-around_medium">
          <!-- Icono informativo al inicio -->
          <div class="header-row">
            <img src={iconVenderHTUrl} style="max-width: 6%" />
            <h2
              id="modal-heading"
              class="slds-text-heading_medium slds-m-left_small"
            >
              Compra/Venta pendiente
            </h2>

            <!-- Botón de cierre circular -->
            <button
              class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse close-circle"
              title="Cerrar"
              onclick={closeModal}
            >
              <lightning-icon
                icon-name="utility:close"
                alternative-text="Cerrar"
                size="small"
              ></lightning-icon>
              <span class="slds-assistive-text">Cerrar</span>
            </button>
          </div>
        </header>

        <!-- Body -->
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content"
        >
          <p class="texto" style="text-align: center">
            Tu <b>compra/venta de HT</b> queda pendiente porque
            <b>no encontramos compras o tenencia anterior</b> de semilla
            fiscalizada de la variedad que estás sembrando.
          </p>

          <p class="texto" style="text-align: center">
            Recordá que es necesario haber comprado previamente semilla
            fiscalizada de esa misma variedad y tener
            <b>licencia de uso firmada.</b>
          </p>

          <p class="texto" style="text-align: center">
            En cuanto envíes tu factura de compra, vas a poder finalizar la
            operación.
          </p>

          <p class="texto" style="text-align: center">
            Nuestro equipo de <b>Mesa de Ayuda</b> se va a contactar con vos
            para acompañarte en el proceso.
          </p>

          <p class="texto" style="text-align: center">
            Si querés resolverlo ahora, hacé clic en WhatsApp y te asistimos en
            el momento.
          </p>

          <center>
            <!-- Botón WhatsApp -->
            <div class="slds-m-top_small">
              <a
                class="slds-button whatsapp-button"
                href="https://api.whatsapp.com/send/?phone=5491131172022&text=Hola%2C+quiero+informaci%C3%B3n+sobre+mi+venta&type=phone_number&app_absent=0"
                target="_blank"
                rel="noopener noreferrer"
              >
                Contactar por Whatsapp
              </a>
            </div>

            <!-- Enlace email -->
            <p class="slds-m-top_small">
              o escribinos a
              <a href="mailto:info@sembrarevolucion.com.ar" class="email-link"
                >info@sembrarevolucion.com.ar</a
              >
            </p>
          </center>
        </div>
      </div>
    </section>

    <!-- Backdrop -->
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- Modal -->
  <template if:true={isOpen2}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="modal-heading"
      class="slds-modal slds-fade-in-open"
      onkeydown={handleKeydown}
    >
      <div class="slds-modal__container">
        <!-- Header -->
        <header class="slds-modal__header slds-p-around_medium">
          <!-- Icono informativo al inicio -->
          <div class="header-row">
            <img src={iconVenderHTUrl} style="max-width: 6%" />
            <h2
              id="modal-heading-2"
              class="slds-text-heading_medium slds-m-left_small"
            >
              Compra/Venta pendiente
            </h2>

            <!-- Botón de cierre circular -->
            <button
              class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse close-circle"
              title="Cerrar"
              onclick={closeModal}
            >
              <lightning-icon
                icon-name="utility:close"
                alternative-text="Cerrar"
                size="small"
              ></lightning-icon>
              <span class="slds-assistive-text">Cerrar</span>
            </button>
          </div>
        </header>

        <!-- Body -->
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content-2"
        >
          <p class="texto" style="text-align: center">
            Tu <b>compra/venta de HT</b> queda pendiente porque el
            <b>CUIT</b> no cuenta con <b>licencia de uso firmada</b>. Recordá
            que, para comprar o vender HT, este es un
            <b>requisito indispensable</b>.
          </p>

          <p class="texto" style="text-align: center">
            Nuestro equipo de <b>Mesa de Ayuda</b> se va a contactar con vos
            para acompañarte en el proceso.
          </p>

          <p class="texto" style="text-align: center">
            Si querés resolverlo ahora:
          </p>

          <center>
            <!-- Botón WhatsApp -->
            <div class="slds-m-top_small">
              <a
                class="slds-button whatsapp-button"
                href="https://api.whatsapp.com/send/?phone=5491131172022&text=Hola%2C+quiero+informaci%C3%B3n+sobre+mi+venta&type=phone_number&app_absent=0"
                target="_blank"
                rel="noopener noreferrer"
              >
                Contactar por Whatsapp
              </a>
            </div>

            <!-- Enlace email -->
            <p class="slds-m-top_small">
              o escribinos a
              <a href="mailto:info@sembrarevolucion.com.ar" class="email-link"
                >info@sembrarevolucion.com.ar</a
              >
            </p>

            <!-- Botón consulta de licencias -->
            <div class="slds-m-top_small">
              <a
                class="slds-button license-outline"
                href={licensesHref}
                target="_blank"
                rel="noopener noreferrer"
                title="Ir a Consulta de Licencias"
              >
                Ir a Consulta de Licencia →
              </a>
            </div>
          </center>
        </div>
      </div>
    </section>

    <!-- Backdrop -->
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <c-pdf-reader></c-pdf-reader>
  <c-ht-modals
    current-modal={currentModal}
    community={community}
    es-punto-venta={obtentorEsPuntoDeVenta}
    onclose={closeModal}
    onredirect={redirect}
    onanular={anular}
  >
  </c-ht-modals>

  <!-- Modal Observaciones -->
  <template if:true={showObsModal}>
    <section
      role="dialog"
      tabindex="-1"
      class="slds-modal slds-fade-in-open"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      aria-describedby="modal-content-id-1"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
            title="Close"
            onclick={handleObsCloseModal}
          >
            <lightning-icon
              icon-name="utility:close"
              alternative-text="close"
              size="small"
            ></lightning-icon>
            <span class="slds-assistive-text">Cerrar</span>
          </button>
          <h2 id="modal-heading-02" class="slds-modal__title slds-hyphenate">
            Observaciones
          </h2>
        </header>
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content-id-1"
        >
          <div class="slds-form-element">
            <lightning-textarea
              name="modalTextarea"
              value={observaciones}
              label="Inserte las observaciones en un máximo de 255 carácteres."
              placeholder={placeholder}
            >
            </lightning-textarea>
          </div>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            variant="neutral"
            label="Cancelar"
            title="Cancelar"
            onclick={handleObsCloseModal}
            disabled={isLoading}
          >
          </lightning-button>
          <lightning-button
            variant="brand"
            label="Guardar"
            title="Guardar"
            onclick={handleObsSave}
            disabled={isLoading}
            class="slds-m-left_x-small"
          >
          </lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- Modal Confirmacion NC Total -->
  <template if:true={showConfirmNCTotalModal}>
    <section
      role="dialog"
      tabindex="-1"
      class="slds-modal slds-fade-in-open"
      aria-labelledby="modal-heading-confirm-nc"
      aria-modal="true"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2
            id="modal-heading-confirm-nc"
            class="slds-modal__title slds-hyphenate"
          >
            {labels.ncConfirmModalTitle}
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p>{labels.ncConfirmModalMessage}</p>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            variant="neutral"
            label="Cancelar"
            title="Cancelar"
            onclick={cancelarNCTotal}
          >
          </lightning-button>
          <lightning-button
            variant="brand"
            label={labels.ncConfirmModalConfirm}
            title={labels.ncConfirmModalConfirm}
            onclick={confirmarNCTotal}
            class="slds-m-left_x-small"
          >
          </lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
