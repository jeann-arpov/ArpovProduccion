<template>
    <section class="p-sum">
        <dl class="id">
            <template if:true={info.account}>
                <dt class="k">CUIT</dt>
                <dd class="v">{info.account.N_CUIT__c}</dd>
                <dt class="k">Razón social</dt>
                <dd class="v">{info.account.Name}</dd>
            </template>
            <dt class="k">Fecha solicitud</dt>
            <dd class="v">{fechaLabel}</dd>
        </dl>
        <div class="div" aria-hidden="true"></div>
        <div class="mets">
            <div class="met">
                <span class="k">{totalesLabel}</span>
                <span class="v">{totalSembradoLabel}</span>
            </div>
            <div class="met">
                <span class="k">HT Sembrá Evolución precertificadas</span>
                <span class="v">{totalSembradoSELabel}</span>
            </div>
            <div class="met">
                <span class="k">HT sin precertificar</span>
                <span class="v warn">{creditoDisponibleLabel}</span>
            </div>
        </div>
    </section>

    <div class="p-dgrid">
        <template for:each={establecimientos} for:item="est">
            <article key={est.key} class="p-acc">
                <div class="p-acc-h">
                    <div class="ttl">
                        <template if:false={isGrandesCuentas}>
                            <small>Establecimiento {est.index}</small>
                        </template>
                        <b>{est.name}</b>
                    </div>
                    <template if:true={canEdit}>
                        <button type="button" class="ed" aria-label="Editar establecimiento" title="Editar establecimiento" data-id={est.editId} onclick={edit}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
                        </button>
                    </template>
                    <button type="button" class={est.chevClass} aria-label={est.toggleLabel} title={est.toggleLabel} aria-expanded={est.isOpen} data-key={est.key} onclick={toggle}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d={est.chevPath}></path></svg>
                    </button>
                </div>
                <div class="p-facts">
                    <div class="p-fact">
                        <div class="k">{totalesLabel}</div>
                        <div class="v">{est.totalSembradoLabel}</div>
                    </div>
                    <template if:true={est.georeferencia}>
                        <div class="p-fact">
                            <div class="k">Georreferencia</div>
                            <div class="v">{est.georeferencia}</div>
                        </div>
                    </template>
                </div>
                <template if:true={est.isOpen}>
                    <div class="p-acc-b">
                        <span class="lbl">Variedades</span>
                        <template for:each={est.lineas} for:item="linea">
                            <div key={linea.key} class="p-line">
                                <span class="nm">
                                    <template if:true={linea.brand}><span class="brand">{linea.brand}</span></template>
                                    <span>{linea.name}</span>
                                </span>
                                <span class="p-num">{linea.cantidadLabel}</span>
                            </div>
                        </template>
                        <template if:false={est.hasLineas}>
                            <p class="none">Sin variedades Sembrá Evolución declaradas.</p>
                        </template>
                        <div class="p-line out">
                            <span>Hectáreas por fuera de SE</span>
                            <b>{est.cantidadNoSELabel}</b>
                        </div>
                    </div>
                </template>
            </article>
        </template>
    </div>

    <template if:true={showActions}>
        <div class="p-dfoot">
            <template if:true={canEdit}>
                <button type="button" class="btn" onclick={enviar}>Enviar</button>
            </template>
            <template if:true={canRectificar}>
                <button type="button" class="btn" onclick={rectificar}>Rectificar</button>
            </template>
        </div>
    </template>
</template>
