<template>
  <div class="ventas-container">
    <!-- TOP BAR con título + filtros y botón -->
    <div class="ventas-top-bar">
      <div class="ventas-header">
        <div class="breadcrumbs">FACTURACION</div>
        <div class="title">Todas las Facturas</div>
      </div>

      <div class="acciones-derecha">
        <div class="filtros-container">
          <select data-id="cultivosSelect" onchange={handleCultivoSelect}>
            <option value="">Cultivo</option>
            <template for:each={cultivos} for:item="item">
              <option key={item} value={item.value}>{item.value}</option>
            </template>
          </select>
          <select onchange={handleMarcaSelect}>
            <option value="">Marca</option>
            <template for:each={marcas} for:item="item">
              <option key={item} value={item.value}>{item.value}</option>
            </template>
          </select>
          <select onchange={handleEstadoSelect}>
            <option value="">Estado</option>
            <template for:each={estados} for:item="item">
              <option key={item} value={item.value}>{item.value}</option>
            </template>
          </select>
        </div>
      </div>
    </div>

    <!-- Info + buscador -->
    <div class="info-busqueda">
      <div class="ventas-info">
        {totalRegistros} elementos (máximo 200 elementos) • Ordenado por Fecha
        de emision • <br />
        Filtrado por Todas las facturas • Se actualizó hace una hora
      </div>

      <div class="ventas-search">
        <input
          type="text"
          oninput={handleSearchChange}
          placeholder="Buscar..."
        />
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <!-- Tabla -->

    <lightning-datatable
      key-field="uniqueId"
      class="dataTable"
      data={data}
      columns={columns}
      onrowaction={handleRowAction}
      onsort={handleOnSort}
      sorted-by={sortBy}
      sorted-direction={sortDirection}
      column-widths-mode="auto"
      resize-column-disabled
      hide-checkbox-column
    >
    </lightning-datatable>

    <div class="paginacion">
      <button onclick={handlePrev} disabled={disablePrev}>Anterior</button>
      <span>Página {currentPage}</span>
      <button onclick={handleNext} disabled={disableNext}>Siguiente</button>
    </div>

    <!-- Modal -->
    <c-pdf-reader></c-pdf-reader>

    <!-- Informar Pago -->
    <c-informar-pago onpagoinformado={onPaymentApproved}></c-informar-pago>

    <!-- Modal Adjuntos -->
    <template if:true={showAdjuntos}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="adjuntos-heading"
        class="slds-modal slds-modal_medium slds-fade-in-open"
      >
        <div class="slds-modal__container">
          <header class="slds-modal__header">
            <button
              class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
              title="Cerrar"
              onclick={closeAdjuntos}
            >
              <lightning-icon
                icon-name="utility:close"
                alternative-text="close"
                variant="inverse"
                size="small"
              ></lightning-icon>
              <span class="slds-assistive-text">Cerrar</span>
            </button>
            <h2
              id="adjuntos-heading"
              class="slds-text-heading_medium slds-hyphenate"
            >
              Documentos
            </h2>
          </header>
          <div class="slds-modal__content slds-p-around_medium">
            <template if:true={adjuntos.length}>
              <ul class="slds-has-dividers_around">
                <template for:each={adjuntos} for:item="a">
                  <li key={a.id} class="slds-p-vertical_x-small">
                    <a
                      href="javascript:void(0);"
                      data-id={a.id}
                      data-title={a.title}
                      onclick={handleVerAdjunto}
                      >{a.title}</a
                    >
                  </li>
                </template>
              </ul>
            </template>
            <template if:false={adjuntos.length}>
              <p>Sin adjuntos.</p>
            </template>
          </div>
          <footer class="slds-modal__footer">
            <button
              class="slds-button slds-button_neutral"
              onclick={closeAdjuntos}
            >
              Cerrar
            </button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </div>
</template>
