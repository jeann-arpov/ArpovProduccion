<template>
    <nav class="bottom-nav" aria-label="Navegación principal">
        <template for:each={leftItems} for:item="item">
            <a key={item.id} class={item.itemClass} href="#" data-page={item.page} onclick={handleNavigate}>
                <span class={item.glyphClass} aria-hidden="true"></span>
                <span class="label">{item.label}</span>
            </a>
        </template>
        <button class={fabClass} type="button" onclick={handleFab} aria-label="Comprar HT">
            <span class="fab-plus" aria-hidden="true"></span>
            <span class="fab-label">Comprar HT</span>
        </button>
        <template for:each={rightItems} for:item="item">
            <a key={item.id} class={item.itemClass} href="#" data-page={item.page} onclick={handleNavigate}>
                <span class={item.glyphClass} aria-hidden="true"></span>
                <span class="label">{item.label}</span>
            </a>
        </template>
    </nav>
</template>
