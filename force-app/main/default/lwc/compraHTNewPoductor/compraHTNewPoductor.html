<template>
    <c-se-list-page loading={pageLoading}>
        <header slot="header" class="mvt-header">
            <p class="eyebrow">HT / MOVIMIENTOS</p>
            <div class="mvt-title-row">
                <h1 class="title">Detalle de Movimientos</h1>
                <div class="mvt-tools se-desk-only">
                    <label class="mvt-search">
                        <span class="sr-only">Buscar</span>
                        <input
                            type="search"
                            placeholder="Buscar..."
                            value={searchTerm}
                            oninput={handleSearchChange}
                        />
                        <span class="search-icon">
                            <img src={iconSearchUrl} alt="" class="icon-svg" />
                        </span>
                    </label>
                    <button
                        type="button"
                        class="filt-toggle"
                        aria-expanded={filtersPanelOpen}
                        onclick={handleToggleFiltersPanel}
                    >
                        <svg class="filt-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <path d="M3 6h18M6 12h12M10 18h4"></path>
                        </svg>
                        Filtros
                        <template if:true={showFilterBadge}>
                            <span class="filt-badge">{activeFilterCount}</span>
                        </template>
                        <svg class={filterToggleChevronClass} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <template if:true={filtersPanelOpen}>
            <section slot="filters" class="filt-panel">
                <div class="filt-panel-head">
                    <span class="filt-panel-title">Filtros</span>
                    <span class="filt-panel-hint">Aplican sobre el cultivo activo en las tabs.</span>
                    <button type="button" class="filt-link" onclick={handleClearFilters}>Limpiar</button>
                    <button type="button" class="filt-close" onclick={handleCloseFiltersPanel}>Cerrar</button>
                </div>
                <div class="filt-grid">
                    <div class="filt-group">
                        <p class="filt-label">Cultivo</p>
                        <div class="filt-options">
                            <template for:each={cultivoFilterItems} for:item="item">
                                <button key={item.value} type="button" class="filt-option" data-group="cultivo" data-value={item.value} onclick={handleFilterToggle}>
                                    <span class={item.boxClass} aria-hidden="true"></span>
                                    <span>{item.label}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <div class="filt-group">
                        <p class="filt-label">Campaña</p>
                        <template if:true={singleCampaniaHint}>
                            <span class="filt-pill">{singleCampaniaLabel}</span>
                            <p class="filt-hint">Única campaña disponible por ahora.</p>
                        </template>
                        <template if:false={singleCampaniaHint}>
                            <div class="filt-options">
                                <template for:each={campaniaFilterItems} for:item="item">
                                    <button key={item.value} type="button" class="filt-option" data-group="campania" data-value={item.value} onclick={handleFilterToggle}>
                                        <span class={item.boxClass} aria-hidden="true"></span>
                                        <span>{item.label}</span>
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="filt-group">
                        <p class="filt-label">Biotecnología / Plataforma</p>
                        <div class="filt-options">
                            <template for:each={biotecnologiaFilterItems} for:item="item">
                                <button key={item.value} type="button" class="filt-option" data-group="biotecnologia" data-value={item.value} onclick={handleFilterToggle}>
                                    <span class={item.boxClass} aria-hidden="true"></span>
                                    <span>{item.label}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <div class="filt-group">
                        <p class="filt-label">Origen del movimiento</p>
                        <div class="filt-options">
                            <template for:each={origenFilterItems} for:item="item">
                                <button key={item.value} type="button" class="filt-option" data-group="origen" data-value={item.value} onclick={handleFilterToggle}>
                                    <span class={item.boxClass} aria-hidden="true"></span>
                                    <span>{item.label}</span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </section>
        </template>

        <template if:true={cultivos}>
            <c-se-cultivo-resumen
                cultivos={cultivos}
                selected={summaryCultivoId}
                rows={summaryRows}
                total-value={summaryTotal}
                loading={summaryLoading}
                onselect={handleCultivoResumenSelect}
            >
                <div slot="afterSaldo" class="mvt-search-row se-mob-only">
                    <label class="mvt-search mvt-search-flex">
                        <span class="sr-only">Buscar</span>
                        <input
                            type="search"
                            placeholder="Buscar..."
                            value={searchTerm}
                            oninput={handleSearchChange}
                        />
                        <span class="search-icon">
                            <img src={iconSearchUrl} alt="" class="icon-svg" />
                        </span>
                    </label>
                    <button type="button" class="filt-toggle filt-toggle-mob" onclick={handleOpenFiltersSheet}>
                        <svg class="filt-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <path d="M3 6h18M6 12h12M10 18h4"></path>
                        </svg>
                        Filtros
                        <template if:true={showFilterBadge}>
                            <span class="filt-badge">{activeFilterCount}</span>
                        </template>
                    </button>
                </div>

                <c-se-data-list
                    records={filteredRows}
                    columns={columns}
                    mobile-fields={mobileFields}
                    title-field="cultivo"
                    badge-field="origen"
                    badge-tone-field="origenTone"
                    key-field="id"
                    hide-mobile-action
                    empty-text="No hay movimientos para mostrar."
                    page-size={listPageSize}
                    loading={listLoading}
                ></c-se-data-list>
            </c-se-cultivo-resumen>
        </template>
    </c-se-list-page>

    <template if:true={filtersSheetOpen}>
        <div class="filt-sheet-wrap" role="presentation">
            <button type="button" class="filt-sheet-scrim" onclick={handleCloseFiltersSheet} aria-label="Cerrar filtros"></button>
            <div class="filt-sheet" role="dialog" aria-modal="true" aria-labelledby="mvt-filt-title">
            <div class="filt-sheet-head">
                <h2 id="mvt-filt-title" class="filt-sheet-title">Filtros</h2>
                <button type="button" class="filt-link" onclick={handleClearFilters}>Limpiar</button>
                <button type="button" class="filt-sheet-x" onclick={handleCloseFiltersSheet} aria-label="Cerrar">✕</button>
            </div>

            <div class="filt-sheet-body">
                <div class="filt-group">
                    <p class="filt-label">Cultivo</p>
                    <template for:each={cultivoFilterItems} for:item="item">
                        <button key={item.value} type="button" class="filt-option" data-group="cultivo" data-value={item.value} data-mobile="true" onclick={handleFilterToggle}>
                            <span class={item.boxClass} aria-hidden="true"></span>
                            <span>{item.label}</span>
                        </button>
                    </template>
                </div>
                <div class="filt-group">
                    <p class="filt-label">Campaña</p>
                    <template if:true={singleCampaniaHint}>
                        <span class="filt-pill">{singleCampaniaLabel}</span>
                        <p class="filt-hint">Única campaña disponible por ahora.</p>
                    </template>
                    <template if:false={singleCampaniaHint}>
                        <template for:each={campaniaFilterItems} for:item="item">
                            <button key={item.value} type="button" class="filt-option" data-group="campania" data-value={item.value} data-mobile="true" onclick={handleFilterToggle}>
                                <span class={item.boxClass} aria-hidden="true"></span>
                                <span>{item.label}</span>
                            </button>
                        </template>
                    </template>
                </div>
                <div class="filt-group">
                    <p class="filt-label">Biotecnología / Plataforma</p>
                    <template for:each={biotecnologiaFilterItems} for:item="item">
                        <button key={item.value} type="button" class="filt-option" data-group="biotecnologia" data-value={item.value} data-mobile="true" onclick={handleFilterToggle}>
                            <span class={item.boxClass} aria-hidden="true"></span>
                            <span>{item.label}</span>
                        </button>
                    </template>
                </div>
                <div class="filt-group">
                    <p class="filt-label">Origen del movimiento</p>
                    <template for:each={origenFilterItems} for:item="item">
                        <button key={item.value} type="button" class="filt-option" data-group="origen" data-value={item.value} data-mobile="true" onclick={handleFilterToggle}>
                            <span class={item.boxClass} aria-hidden="true"></span>
                            <span>{item.label}</span>
                        </button>
                    </template>
                </div>
            </div>

            <button type="button" class="filt-apply" onclick={handleApplyFiltersSheet}>Aplicar filtros</button>
            </div>
        </div>
    </template>
</template>
