<template>
    <div class="se-adhesion-root">
        <template if:true={showLoadError}>
            <section class="pph-load-error">
                <h2>No se pudo cargar la adhesión PPH</h2>
                <p>{loadError}</p>
                <p class="pph-load-error-hint">Revisá que la URL tenga <code>?recordId=</code> con el Id del Parámetro PPH.</p>
            </section>
        </template>

        <template if:true={loading}>
            <div class="exampleHolder">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={showDeclarationWizard}>
            <div class="pph-wiz">
                <div class="pph-wiz-prog" aria-label="Progreso">
                    <div class="pph-wiz-prog-row">
                        <span>{wizardProgressLabel}</span>
                        <span>{wizardProgressPctLabel}</span>
                    </div>
                    <div class="pph-wiz-prog-bar" aria-hidden="true">
                        <span class="pph-wiz-prog-fill" style={wizardProgressBarStyle}></span>
                    </div>
                    <div class="pph-wiz-steps">
                        <template for:each={wizardStepsUi} for:item="s">
                            <span key={s.key} class={s.className}>{s.label}</span>
                        </template>
                    </div>
                </div>

                <div class="pph-wiz-layout">
                    <section class="se-panel se-panel--pph-step">
                        <header class="pph-step-head">
                            <p class="pph-step-eyebrow" if:true={cultivoPillLabel}>{cultivoPillLabel}</p>
                            <h1 class="pph-step-title">{mobPageTitle}</h1>
                            <p class="pph-step-sub">{mobPageSubtitle}</p>
                        </header>

                        <button type="button" class="se-link-btn" onclick={handleOnInformarPagoClick}>
                            No veo mis HTs
                        </button>

                        <div class="se-saldo-card">
                            <span class="se-saldo-label">Saldo PPH disponible</span>
                            <span class="se-saldo-value">{saldoPphLabel} HT</span>
                            <span class="se-saldo-sub">{cultivoPillLabel} · {paramName}</span>
                        </div>

                        <template for:each={establecimientos} for:item="establecimiento">
                            <c-establecimiento-pph
                                cultivo={plan.Parametro_PPH__r.Cultivo__r}
                                class="se-est-block"
                                key={establecimiento.id}
                                info={establecimiento}
                                hiding={hiding}
                                grandes-cuentas={grandesCuentas}
                                variant="wizard"
                                onupdatecantidad={updateCantidad}
                                onshowmap={showMap}
                                onremove={remove}
                                onautosave={autosave}
                                onestablecimientochange={changeEstablecimiento}
                                onpasoestablecimiento={handlePasoEstablecimiento}
                                onpasohectareasnose={handlePasoHectareasNoSE}
                            ></c-establecimiento-pph>
                        </template>

                        <button
                            type="button"
                            class="se-add-est"
                            onclick={addRow}
                            if:false={hideAddEstablecimiento}
                        >
                            + Agregar establecimiento
                        </button>

                        <div class="se-panel-actions">
                            <button type="button" class="se-btn se-btn-ghost" onclick={handleMobClose}>Cancelar</button>
                            <button
                                type="button"
                                class="se-btn se-btn-primary continue"
                                disabled={mobFooterContinuarDisabled}
                                onclick={handleMobContinuar}
                            >Continuar →</button>
                        </div>
                    </section>

                    <aside class="se-side-card se-desk-only">
                        <p class="se-side-eyebrow">Resumen</p>
                        <h2 class="se-side-title">Adhesión PPH</h2>
                        <dl class="se-side-list">
                            <div class="se-side-row">
                                <dt>Campaña</dt>
                                <dd>{paramName}</dd>
                            </div>
                            <div class="se-side-row">
                                <dt>Cultivo</dt>
                                <dd>{cultivoPillLabel}</dd>
                            </div>
                            <div class="se-side-row">
                                <dt>Establecimientos</dt>
                                <dd>{deskEstablecimientosCount}</dd>
                            </div>
                        </dl>
                        <div class="se-side-total">
                            <span class="se-side-total-label">HT SE declaradas</span>
                            <span class="se-side-total-value">{deskTotalSeLabel}</span>
                        </div>
                    </aside>
                </div>
            </div>
        </template>

        <template if:true={showTerminos}>
            <section class="se-panel se-panel--pph-tc">
                <c-terminos-y-condiciones
                    cultivo={cultivo}
                    grandes-cuentas={grandesCuentas}
                    campaña={campaña}
                    oncancel={cancelTerms}
                    onaccept={acceptTerms}
                ></c-terminos-y-condiciones>
            </section>
        </template>

        <template if:true={showPphDetalle}>
            <c-pph-detalle
                info={resumenData}
                certificado-document-id={certificadoDocumentId}
                onback={handleDetalleBack}
                ondownloadpdf={handleDetalleDownloadPdf}
                onnotify={handleDetalleNotify}
            ></c-pph-detalle>
        </template>
        <div class="se-panel-actions se-panel-actions--detalle" if:true={showDetalleRectificar}>
            <button
                type="button"
                class="se-btn se-btn-primary"
                onclick={rectificarConfirm}
            >Rectificar</button>
        </div>

        <template if:true={showResumenContent}>
            <section class="se-panel se-panel--pph-resumen">
                <c-resumen-pph
                    mobile-embedded={isResumenMobileEmbedded}
                    info={resumenData}
                    onedit={edit}
                    onenviar={enviarConfirm}
                    onrectificar={rectificarConfirm}
                ></c-resumen-pph>
                <div class="se-panel-actions">
                    <button type="button" class="se-btn se-btn-ghost" onclick={handleDetalleBack}>
                        Volver a adhesiones
                    </button>
                    <button
                        type="button"
                        class="se-btn se-btn-primary"
                        if:true={canEditResumen}
                        onclick={enviarConfirm}
                    >Enviar adhesión</button>
                    <button
                        type="button"
                        class="se-btn se-btn-primary"
                        if:true={canRectificarResumen}
                        onclick={rectificarConfirm}
                    >Rectificar</button>
                </div>
            </section>
        </template>

        <template if:true={showEmptyState}>
            <section class="pph-load-error">
                <h2>No hay contenido para mostrar</h2>
                <p>El plan cargó pero ninguna vista quedó activa.</p>
            </section>
        </template>

        <c-map onlocationselected={updateLocation}></c-map>
        <c-modals-pph
            callback={modalCallback}
            current-modal={currentModal}
            onclose={closeModal}
        ></c-modals-pph>
        <c-informar-pago></c-informar-pago>
        <c-pdf-reader></c-pdf-reader>
    </div>
</template>
