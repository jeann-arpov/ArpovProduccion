<template>
    <c-se-list-page loading={loading}>
        <c-se-page-header
            slot="header"
            eyebrow="Precertificación / Mis PPH"
            eyebrow-mobile="Precertificación"
            title="PPH"
        ></c-se-page-header>

        <div class="pph-stack">
            <template for:each={groups} for:item="group">
                <section key={group.id} class="pph-crop">
                    <header class="pph-crop-h">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"></path><path d="M12 9c0-3 2-5 5-5 0 3-2 5-5 5zM12 9c0-3-2-5-5-5 0 3 2 5 5 5zM12 14c0-3 2-5 5-5 0 3-2 5-5 5zM12 14c0-3-2-5-5-5 0 3 2 5 5 5z"></path></svg>
                        <span>{group.name}</span>
                    </header>

                    <template for:each={group.plans} for:item="plan">
                        <article key={plan.id} class="pph-plan">
                            <div class="pph-plan-info">
                                <p class="pph-plan-name">{plan.title}</p>
                                <p class="pph-meta">{plan.periodo}</p>
                            </div>

                            <div class="pph-plan-badge">
                                <c-se-badge label={plan.statusLabel} tone={plan.badgeTone} show-dot></c-se-badge>
                            </div>

                            <div class="pph-actions">
                                <template if:true={plan.hasTerminos}>
                                    <button
                                        type="button"
                                        class="pph-icon-btn"
                                        aria-label="Términos y Condiciones"
                                        title="Términos y Condiciones"
                                        data-id={plan.id}
                                        onclick={showTerminos}
                                    >
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>
                                    </button>
                                </template>
                                <template if:false={plan.hasTerminos}>
                                    <span class="pph-icon-spacer" aria-hidden="true"></span>
                                </template>

                                <template if:true={plan.actionDisabled}>
                                    <span class="pph-closed">{plan.disabledCause}</span>
                                </template>
                                <template if:false={plan.actionDisabled}>
                                    <button type="button" class={plan.btnClass} data-id={plan.id} onclick={handleAction}>
                                        {plan.actionLabel}
                                    </button>
                                </template>
                            </div>
                        </article>
                    </template>
                </section>
            </template>

            <template if:true={isEmpty}>
                <p class="pph-empty">No hay adhesiones para mostrar.</p>
            </template>
        </div>
    </c-se-list-page>

    <c-pdf-reader></c-pdf-reader>
</template>
