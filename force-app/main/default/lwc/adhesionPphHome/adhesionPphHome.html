<template>
    <c-se-list-page loading={loading}>
        <c-se-page-header
            slot="header"
            eyebrow="PRECERTIFICACIÓN"
            eyebrow-mobile="MÓDULOS · PPH"
            title="Tus adhesiones"
            subtitle="Campañas de adhesión al Programa de Precertificación de Hectáreas."
            show-search
            search-placeholder="Buscar campaña o cultivo..."
            onsearchchange={handleSearchChange}
        ></c-se-page-header>

        <div slot="toolbar">
            <c-se-filter-pills items={statusPills} onselect={handlePill}></c-se-filter-pills>
        </div>

        <div slot="filters">
            <c-se-select
                options={cultivoOptions}
                value={cultivoSeleccionado}
                placeholder="Todos los cultivos"
                onchange={handleCultivo}
            ></c-se-select>
        </div>

        <c-se-data-list
            records={filtered}
            columns={columns}
            mobile-fields={mobileFields}
            title-field="title"
            badge-field="statusLabel"
            badge-tone-field="statusTone"
            key-field="id"
            action-label="Abrir"
            mobile-action-label-field="mobileActionLabel"
            mobile-action-variant-field="mobileActionVariant"
            action-disabled-field="actionDisabled"
            empty-text="No hay adhesiones para mostrar."
            page-size={pageSize}
            loading={loading}
            onrowaction={handleRowAction}
        ></c-se-data-list>
    </c-se-list-page>

    <c-pdf-reader></c-pdf-reader>
</template>
