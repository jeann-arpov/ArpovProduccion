<template>
    <c-se-list-page loading={loading}>
        <c-se-page-header
            slot="header"
            eyebrow="MIS COMPRAS"
            eyebrow-mobile="MÓDULOS · MIS COMPRAS"
            title="Todas las facturas"
            subtitle="Facturas de Compra HT, Precertificación y servicios asociados."
            action-label="Exportar"
            onaction={handleExport}
        ></c-se-page-header>

        <c-se-filter-pills slot="toolbar" items={statusPills} onselect={handlePill}></c-se-filter-pills>

        <c-se-data-list
            records={data}
            columns={columns}
            mobile-fields={mobileFields}
            title-field="numero"
            badge-field="statusLabel"
            badge-tone-field="statusTone"
            badge-hint-field="statusHint"
            key-field="uniqueId"
            action-label="Ver"
            mobile-action-label="Ver documentos →"
            mobile-action-variant="link"
            empty-text="No hay facturas para mostrar."
            action-disabled-field="actionDisabled"
            secondary-action-label="Informar pago"
            secondary-action-field="canInformarPago"
            fit-actions
            page-size={pageSize}
            loading={loading}
            onrowaction={handleRowAction}
        ></c-se-data-list>
    </c-se-list-page>

    <template if:true={showDocumentos}>
        <div class="mf-scrim" onclick={closeDocumentos}>
            <section
                class="mf-dialog"
                role="dialog"
                aria-modal="true"
                aria-labelledby="mf-docs-title"
                onclick={stopPropagation}
            >
                <button type="button" class="mf-close" onclick={closeDocumentos} aria-label="Cerrar">✕</button>
                <h2 id="mf-docs-title" class="mf-title">Documentos</h2>
                <div class="mf-rule" aria-hidden="true"></div>

                <ul class="mf-docs">
                    <template if:true={documentosFactura}>
                        <li class="mf-doc">
                            <button type="button" class="mf-doc-link" onclick={handleVerFacturaPdf}>
                                Factura electrónica (PDF)
                            </button>
                        </li>
                    </template>
                    <template for:each={adjuntos} for:item="adjunto">
                        <li key={adjunto.id} class="mf-doc">
                            <a class="mf-doc-link" href={adjunto.url} target="_blank" rel="noopener noreferrer">
                                {adjunto.title}
                            </a>
                        </li>
                    </template>
                </ul>

                <template if:true={documentosLoading}>
                    <div class="mf-docs-loading" role="status">
                        <c-se-brand-loader></c-se-brand-loader>
                    </div>
                </template>
                <template if:true={showDocumentosEmpty}>
                    <p class="mf-empty">Sin documentos.</p>
                </template>

                <div class="mf-actions">
                    <button type="button" class="mf-btn" onclick={closeDocumentos}>Cerrar</button>
                </div>
            </section>
        </div>
    </template>

    <c-pdf-reader></c-pdf-reader>
    <c-informar-pago onpagoinformado={handlePagoInformado}></c-informar-pago>
</template>
