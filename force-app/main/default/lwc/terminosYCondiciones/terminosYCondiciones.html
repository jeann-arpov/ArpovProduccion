<template>
    <div class="tc-root">
        <p class="tc-eyebrow">{eyebrowLabel}</p>
        <h1 class="tc-title">Términos y Condiciones</h1>

        <nav class="tc-steps" aria-label="Progreso de adhesión">
            <div class="tc-step tc-step--done">
                <span class="tc-step-marker" aria-hidden="true">✓</span>
                <span class="tc-step-label">Establecimientos</span>
            </div>
            <div class="tc-step tc-step--done">
                <span class="tc-step-marker" aria-hidden="true">✓</span>
                <span class="tc-step-label">Hectáreas SE / no SE</span>
            </div>
            <div class="tc-step tc-step--current" aria-current="step">
                <span class="tc-step-marker" aria-hidden="true">3</span>
                <span class="tc-step-label">Términos y Condiciones</span>
            </div>
        </nav>

        <section class="tc-card">
            <div class="tc-scroll" onscroll={scrollTerminos}>
                <lightning-formatted-rich-text
                    class="tc-rich"
                    value={terminosYCondiciones}
                ></lightning-formatted-rich-text>
            </div>

            <label class="tc-check-row">
                <input
                    type="checkbox"
                    class="tc-check"
                    disabled={checkboxDisabled}
                    checked={accepted}
                    onchange={handleCheckChange}
                />
                <span class="tc-check-label">Acepto los términos y condiciones</span>
            </label>
            <p class="tc-hint">Leer términos y condiciones hasta el final para poder continuar</p>

            <div class="tc-actions">
                <button type="button" class="tc-btn tc-btn-ghost" onclick={cancel}>
                    ← Volver
                </button>
                <button
                    type="button"
                    class="tc-btn tc-btn-primary"
                    disabled={acceptDisabled}
                    onclick={accept}
                >
                    Aceptar
                </button>
            </div>
        </section>
    </div>
</template>
