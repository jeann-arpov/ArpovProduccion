<template>
    <div class="se-resumen-root">
        <section class={mobileSectionClass}>
            <template if:true={showMobileHead}>
            <header class="se-resumen-head">
                <h1 class="se-resumen-title">{pageTitle}</h1>
                <p class="se-resumen-sub">{tipoCesionLabel} · {cultivoLabel}</p>
            </header>
            </template>

            <div class="se-resumen-hero">
                <div class="se-resumen-hero-top">
                    <span class="se-resumen-hero-label">Toneladas cedidas</span>
                    <span class="se-resumen-hero-value">{toneladasTotalesLabel} t</span>
                </div>
                <dl class="se-resumen-meta">
                    <div class="se-resumen-meta-row">
                        <dt>Fecha solicitud</dt>
                        <dd>{fechaLabel}</dd>
                    </div>
                    <div class="se-resumen-meta-row">
                        <dt>Estado</dt>
                        <dd>{estadoLabel}</dd>
                    </div>
                    <template if:true={showTnsBolsatech}>
                        <div class="se-resumen-meta-row">
                            <dt>Bolsa Tech</dt>
                            <dd>{tnsBolsatechLabel} t</dd>
                        </div>
                    </template>
                </dl>
            </div>

            <template for:each={destinatarios} for:item="destinatario">
                <article key={destinatario.id} class="se-resumen-dest">
                    <div class="se-resumen-dest-head">
                        <div class="se-resumen-dest-copy">
                            <p class="se-resumen-eyebrow">Destinatario</p>
                            <h2 class="se-resumen-dest-name">{destinatario.razonSocial}</h2>
                            <p class="se-resumen-dest-cuit">CUIT {destinatario.cuit}</p>
                        </div>
                        <button
                            if:true={destinatario.canEdit}
                            type="button"
                            class="se-resumen-edit"
                            data-id={destinatario.id}
                            onclick={edit}
                        >
                            Editar
                        </button>
                    </div>

                    <div class="se-resumen-dest-ton">
                        <span>Total cedido</span>
                        <strong>{destinatario.toneladasLabel} t</strong>
                    </div>

                    <template if:false={destinatario.collapsed}>
                        <p class="se-resumen-var-title">Variedades</p>
                        <div class="se-resumen-lines">
                            <template for:each={destinatario.lineas} for:item="linea">
                                <div key={linea.id} class="se-resumen-line">
                                    <div class="se-resumen-line-main">
                                        <span class="se-resumen-line-name">{linea.name}</span>
                                        <span class="se-resumen-line-qty">{linea.cantidadLabel} t</span>
                                    </div>
                                    <span class={linea.licenseClass} title={linea.licenseTitle}>
                                        {linea.licenseLabel}
                                    </span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <button
                        type="button"
                        class="se-resumen-toggle"
                        data-destinatario={destinatario.id}
                        onclick={changeCollapsed}
                    >
                        <template if:true={destinatario.collapsed}>Ver variedades</template>
                        <template if:false={destinatario.collapsed}>Ocultar variedades</template>
                    </button>
                </article>
            </template>

            <template if:true={showMobileFooter}>
            <footer class="se-resumen-footer">
                <button type="button" class="se-resumen-btn se-resumen-btn-ghost" onclick={redirectInicio}>
                    Guardar
                </button>
                <button
                    if:true={canSend}
                    type="button"
                    class="se-resumen-btn se-resumen-btn-primary"
                    onclick={enviar}
                >
                    Enviar cesión
                </button>
                <button
                    if:true={canAnular}
                    type="button"
                    class="se-resumen-btn se-resumen-btn-danger"
                    onclick={anular}
                >
                    Anular
                </button>
            </footer>
            </template>

            <template if:true={showEmbeddedAnular}>
                <button type="button" class="se-resumen-anular" onclick={anular}>Anular cesión</button>
            </template>
        </section>
    </div>
</template>
