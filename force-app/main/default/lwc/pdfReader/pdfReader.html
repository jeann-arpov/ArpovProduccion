<template>
        <template if:true={showSgModal}>
            <div class="sg-layer" role="dialog" aria-modal="true" aria-labelledby="sg-pdf-title">
                <div class="sg-scrim" onclick={handleOnCloseModal}></div>
                <div class="sg-modal">
                    <div class="sg-mhead">
                        <h2 id="sg-pdf-title" class="sg-mtitle">{title}</h2>
                        <button type="button" class="sg-x" aria-label="Cerrar" onclick={handleOnCloseModal}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                        </button>
                    </div>
                    <div class="sg-pdfbar">
                        <span>{barLabel}</span>
                        <a class="sg-pdfbar-act" href={pdfUrl} target="_blank" rel="noopener noreferrer" aria-label="Abrir en una pestaña nueva" title="Abrir en una pestaña nueva">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"></path></svg>
                        </a>
                    </div>
                    <div class="sg-pdfbody">
                        <iframe src={pdfUrl} title={title} onload={handleOnLoadPDF}></iframe>
                    </div>
                </div>
            </div>
        </template>

        <section if:true={showLegacyModal} role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-modal_large slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse pdf-close-desk" title="Close" onclick={handleOnCloseModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <button type="button" class="pdf-back-mob" onclick={handleOnCloseModal}>
                        <span aria-hidden="true">←</span> Volver
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{title}</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div class="pdf-open-mob">
                        <span>¿No ves el documento?</span>
                        <a href={pdfUrl} target="_blank" rel="noopener noreferrer">Abrir en una pestaña nueva</a>
                    </div>
                    <p><iframe src={pdfUrl} onload={handleOnLoadPDF}></iframe></p>
                </div>
            </div>
        </section>
        <div if:true={showLegacyModal} class="slds-backdrop slds-backdrop_open"></div>
</template>
