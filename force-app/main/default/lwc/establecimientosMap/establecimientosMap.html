<template>
    <!-- Vista mapa: sheet propio (evita lista rota de lightning-map en mobile) -->
    <template if:true={mapSheetMounted}>
        <div class={mapBackdropClass} onclick={handleMapBackdropClick}></div>
        <section
            class={mapSheetClass}
            role="dialog"
            aria-modal="true"
            aria-labelledby="se-map-title"
        >
            <header class="se-sheet-head">
                <button type="button" class="se-sheet-back" onclick={closeMap} aria-label="Cerrar">
                    ←
                </button>
                <h2 id="se-map-title" class="se-sheet-title">Ubicaciones</h2>
                <span class="se-sheet-spacer"></span>
            </header>

            <div class="se-view-body">
                <div class="se-view-map-stage">
                    <template if:true={showMapCanvas}>
                        <lightning-map
                            class="se-view-map"
                            map-markers={markers}
                            list-view="hidden"
                        ></lightning-map>
                    </template>
                    <template if:false={hasMarkers}>
                        <div class="se-view-map-empty">
                            <p>No hay establecimientos con coordenadas para mostrar.</p>
                        </div>
                    </template>
                </div>

                <div class="se-view-list" if:true={hasMarkers}>
                    <p class="se-view-list-label">{markersCountLabel}</p>
                    <ul class="se-view-list-ul">
                        <template for:each={markerItems} for:item="item">
                            <li key={item.key} class="se-view-list-item">
                                <span class="se-view-list-pin" aria-hidden="true"></span>
                                <div class="se-view-list-copy">
                                    <span class="se-view-list-name">{item.title}</span>
                                    <span class="se-view-list-coords">{item.coords}</span>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </section>
    </template>

    <template if:true={newSheetMounted}>
        <div class={newBackdropClass} onclick={handleBackdropClick}></div>
        <section
            class={newSheetClass}
            role="dialog"
            aria-modal="true"
            aria-labelledby="se-sheet-title"
        >
            <header class="se-sheet-head">
                <button type="button" class="se-sheet-back" onclick={closeNew} aria-label="Volver">
                    ←
                </button>
                <h2 id="se-sheet-title" class="se-sheet-title">Nuevo establecimiento</h2>
                <span class="se-sheet-spacer"></span>
            </header>

            <div class="se-map-stage">
                <iframe
                    class="se-map-iframe"
                    src={mapPreviewSource}
                    title="Mapa de georeferencia"
                ></iframe>

                <div class="se-map-coords">{mapCoodinates}</div>

                <button
                    type="button"
                    class="se-map-locate"
                    onclick={handleLocateMe}
                    aria-label="Mi ubicación"
                    title="Mi ubicación"
                >
                    ⌖
                </button>

                <div class="se-map-pin" aria-hidden="true">
                    <svg width="36" height="48" viewBox="0 0 36 48" fill="none">
                        <path
                            d="M18 46c0 0 14-16 14-28A14 14 0 1 0 4 18c0 12 14 28 14 28z"
                            fill="#1C1C1C"
                            stroke="#BFFF00"
                            stroke-width="2.5"
                        ></path>
                        <circle cx="18" cy="17" r="5" fill="#BFFF00"></circle>
                    </svg>
                </div>

                <div class="se-map-hint">
                    Movés el pin arrastrándolo. Ajustá los límites del establecimiento en el próximo paso.
                </div>
            </div>

            <div class="se-sheet-form">
                <label class="se-field-label">Nombre del establecimiento</label>
                <input
                    class="se-field-native"
                    type="text"
                    value={selectedName}
                    oninput={handleNameInput}
                    placeholder="Ej: La Emilia"
                    required
                />

                <label class="se-field-label">Superficie (ha)</label>
                <input
                    class="se-field-native"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="1"
                    value={selectedSuperficie}
                    oninput={handleSuperficieInput}
                    placeholder="Ej: 840"
                />
                <p class="se-field-note">La superficie es informativa en esta pantalla; aún no se guarda en Salesforce.</p>
            </div>

            <footer class="se-sheet-foot">
                <button type="button" class="se-btn se-btn-ghost" onclick={closeNew}>Cancelar</button>
                <button type="button" class="se-btn se-btn-primary" onclick={handleSave} disabled={saveDisabled}>
                    Guardar
                </button>
            </footer>
        </section>
    </template>

    <template if:true={successMounted}>
        <div class={successBackdropClass} onclick={closeSuccess}></div>
        <section class={successDialogClass} role="alertdialog" aria-labelledby="se-ok-title">
            <h3 id="se-ok-title" class="se-dialog-title">Nuevo establecimiento</h3>
            <p class="se-dialog-copy">{mensaje}</p>
            <button type="button" class="se-btn se-btn-primary se-dialog-cta" onclick={closeSuccess}>
                Aceptar →
            </button>
        </section>
    </template>
</template>
