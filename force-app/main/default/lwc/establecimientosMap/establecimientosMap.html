<template>
    <template if:true={mapOpen}>
        <div class="p-layer" onkeydown={handleKeydown}>
            <div class="p-scrim" onclick={closeMap}></div>
            <section class="p-modal p-modal-map" role="dialog" aria-modal="true" aria-labelledby="se-map-title">
                <header class="p-mhead">
                    <h2 id="se-map-title" class="p-mtitle">Ubicaciones de establecimientos</h2>
                    <button type="button" class="p-x" onclick={closeMap} aria-label="Cerrar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                    </button>
                </header>

                <div class="p-mapgrid">
                    <div class="p-map">
                        <template if:true={showMapCanvas}>
                            <lightning-map
                                class="p-map-canvas"
                                map-markers={markers}
                                list-view="hidden"
                                selected-marker-value={selectedMarker}
                                onmarkerselect={handleMapMarkerSelect}
                            ></lightning-map>
                        </template>
                        <template if:true={showMapEmpty}>
                            <div class="p-map-empty">No hay establecimientos con coordenadas para mostrar.</div>
                        </template>
                    </div>

                    <div class="p-mklist">
                        <p class="p-mklabel">{markersLabel}</p>
                        <div class="p-mkscroll">
                            <template for:each={markerItems} for:item="item">
                                <button
                                    key={item.key}
                                    type="button"
                                    class={item.className}
                                    data-id={item.key}
                                    onclick={handleMarkerSelect}
                                >
                                    <span class="pin" aria-hidden="true">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.4 7-13a7 7 0 1 0-14 0c0 5.6 7 13 7 13z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
                                    </span>
                                    <span class="txt">
                                        <b>{item.title}</b>
                                        <span>{item.coords}</span>
                                    </span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </template>

    <template if:true={newOpen}>
        <div class="p-layer" onkeydown={handleKeydown}>
            <div class="p-scrim" onclick={closeNew}></div>
            <section class="p-modal p-modal-new" role="dialog" aria-modal="true" aria-labelledby="se-new-title">
                <span class="p-handle" aria-hidden="true"></span>
                <header class="p-mhead">
                    <h2 id="se-new-title" class="p-mtitle">Nuevo establecimiento</h2>
                    <button type="button" class="p-x" onclick={closeNew} aria-label="Cerrar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                    </button>
                </header>

                <div class="p-fields two">
                    <div>
                        <label class="p-label" for="se-new-name">Nombre del establecimiento<span class="req">*</span></label>
                        <input
                            id="se-new-name"
                            data-id="new-name"
                            class={nameInputClass}
                            type="text"
                            maxlength="80"
                            value={selectedName}
                            oninput={handleNameInput}
                        />
                        <template if:true={nameError}>
                            <p class="p-err">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
                                {nameError}
                            </p>
                        </template>
                    </div>
                    <div>
                        <span class="p-label">Georreferencia<span class="req">*</span></span>
                        <button type="button" class={geoClass} onclick={openGeo}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-7.4 7-13a7 7 0 1 0-14 0c0 5.6 7 13 7 13z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
                            <span class="p-geo-txt">Seleccionar punto de lote</span>
                        </button>
                        <template if:true={hasGeo}>
                            <span class="p-geo-chip">{geoLabel}</span>
                        </template>
                        <template if:true={geoErrorMsg}>
                            <p class="p-err">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
                                {geoErrorMsg}
                            </p>
                        </template>
                    </div>
                </div>

                <template if:true={saveError}>
                    <p class="p-alert" role="alert">{saveError}</p>
                </template>

                <footer class="p-mfoot">
                    <button type="button" class="btn ghost" onclick={closeNew} disabled={saving}>Cancelar</button>
                    <button type="button" class="btn btn-main" onclick={handleSave} disabled={saving}>{saveLabel}</button>
                </footer>
            </section>
        </div>
    </template>

    <template if:true={successOpen}>
        <div class="p-layer" onkeydown={handleKeydown}>
            <div class="p-scrim" onclick={closeSuccess}></div>
            <section class="p-modal p-modal-ok" role="alertdialog" aria-labelledby="se-ok-title">
                <span class="p-confirm-ic" aria-hidden="true">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                </span>
                <h2 id="se-ok-title" class="p-msg">{mensaje}</h2>
                <button type="button" class="btn btn-main" onclick={closeSuccess}>Aceptar</button>
            </section>
        </div>
    </template>

    <c-map></c-map>
</template>
